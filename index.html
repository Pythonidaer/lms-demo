} }\ntype Input = ConstructorParameters\u003ctypeof Lesson>;\ntype Output = InstanceType\u003ctypeof Lesson>;\nconst input: Input = [\"Types\"];\nconst lesson: Output = new Lesson(...input);\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-union-utilities-takeaway","title":"Keep this in mind","body":"NoInfer is available in TypeScript 5.4+. ThisType is a contextual marker, not runtime binding. Utility types help you express relationships, but do not perform runtime transformations.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-utilities-quiz","type":"quiz","title":"Skill check · Use the standard utility types","skill":"Use the standard utility types","questions":[{"id":"ts-sec-utilities-quiz-q1","prompt":"Does assigning an object to Omit\u003cUser, \"secret\"> remove secret at runtime?","options":["Only with strict enabled","No; explicitly construct a sanitized object","Yes, automatically"],"answer":1,"explanation":"Type erasure does not delete fields. A projection function must actually remove them."},{"id":"ts-sec-utilities-quiz-q2","prompt":"Which utility removes null and undefined from a type?","options":["NonNullable\u003cT>","Required\u003cT>","Partial\u003cT>"],"answer":0,"explanation":"NonNullable filters nullish union members. Required changes property optionality."},{"id":"ts-sec-utilities-quiz-q3","prompt":"What does NoInfer\u003cT> influence?","options":["Runtime input validation","Whether properties are readonly","Inference from that type position"],"answer":2,"explanation":"NoInfer blocks that position from contributing inference candidates; it still checks compatibility."}],"sources":[{"title":"Utility Types","url":"https://www.typescriptlang.org/docs/handbook/utility-types.html"}]}],"sources":[{"title":"Utility Types","url":"https://www.typescriptlang.org/docs/handbook/utility-types.html"}],"studyGuide":{"title":"11 · Use the standard utility types · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["Omit changes the type, not the runtime contents. Explicitly construct public outputs when fields must actually be removed.","NoInfer is available in TypeScript 5.4+. ThisType is a contextual marker, not runtime binding. Utility types help you express relationships, but do not perform runtime transformations."]}},{"id":"ts-sec-classes","type":"section","title":"12 · Classes, compatibility, and composition","children":[{"id":"ts-lesson-class-contracts","type":"slides","title":"Initialization, inheritance, and privacy","minutes":15,"objectives":["Separate class runtime behavior from type-level restrictions."],"sources":[{"title":"Classes","url":"https://www.typescriptlang.org/docs/handbook/2/classes.html"},{"title":"Type Compatibility","url":"https://www.typescriptlang.org/docs/handbook/type-compatibility.html"},{"title":"Mixins","url":"https://www.typescriptlang.org/docs/handbook/mixins.html"},{"title":"MDN: Classes","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_classes"}],"slides":[{"id":"ts-lesson-class-contracts-concept","title":"Initialization, inheritance, and privacy","body":"YOUR GOAL\nSeparate class runtime behavior from type-level restrictions.\n\nConstructors initialize fields; strictPropertyInitialization checks required fields. implements checks that a class satisfies a contract but does not create members. extends establishes runtime inheritance. TypeScript private is mainly a type-checking restriction; JavaScript #private provides runtime privacy. readonly does not freeze nested values."},{"id":"ts-lesson-class-contracts-example","title":"Read the code","body":"```ts\ninterface Named { title: string }\nclass Lesson implements Named {\n  #views = 0;\n  constructor(public readonly id: string, public title: string) {}\n  view(): number { return ++this.#views; }\n}\nconst lesson = new Lesson(\"a\", \"Types\");\nconsole.log(lesson.view());\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-class-contracts-practice","title":"Try it yourself","body":"Create abstract class Content with abstract summary(): string. Implement TextContent with a constructor parameter property. Show why implements alone would not supply summary.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-class-contracts-solution","title":"Compare your solution","body":"```ts\nabstract class Content { abstract summary(): string; }\nclass TextContent extends Content {\n  constructor(public text: string) { super(); }\n  summary(): string { return this.text.slice(0, 40); }\n}\nconsole.log(new TextContent(\"Learn TypeScript\").summary());\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-class-contracts-takeaway","title":"Keep this in mind","body":"A definite-assignment assertion (!) suppresses an initialization check; it does not initialize the field. Check JavaScript this binding when passing instance methods.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-compatibility","type":"slides","title":"Structural typing, variance, and mixins","minutes":15,"objectives":["Understand why assignments succeed or fail."],"sources":[{"title":"Classes","url":"https://www.typescriptlang.org/docs/handbook/2/classes.html"},{"title":"Type Compatibility","url":"https://www.typescriptlang.org/docs/handbook/type-compatibility.html"},{"title":"Mixins","url":"https://www.typescriptlang.org/docs/handbook/mixins.html"},{"title":"MDN: Classes","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_classes"}],"slides":[{"id":"ts-lesson-compatibility-concept","title":"Structural typing, variance, and mixins","body":"YOUR GOAL\nUnderstand why assignments succeed or fail.\n\nMost compatibility is structural: required members matter more than declaration names. Private and protected class members add origin constraints. Function parameter checking under strictFunctionTypes protects against overly narrow callbacks, with a method-syntax exception. Generics that produce T and consume T have different compatibility directions. Compose capabilities when inheritance does not fit."},{"id":"ts-lesson-compatibility-example","title":"Read the code","body":"```ts\ntype Animal = { name: string };\ntype Dog = Animal & { bark(): void };\ntype Producer\u003cT> = { make(): T };\ntype Consumer\u003cT> = { consume: (value: T) => void };\nconst dogMaker: Producer\u003cDog> = { make: () => ({ name: \"Ada\", bark() {} }) };\nconst animalMaker: Producer\u003cAnimal> = dogMaker;\nconst consumeAnimal: Consumer\u003cAnimal> = { consume: a => console.log(a.name) };\nconst consumeDog: Consumer\u003cDog> = consumeAnimal;\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-compatibility-practice","title":"Try it yourself","body":"Create two separately named interfaces with identical fields and assign one to the other. Then explain why a callback accepting only Dog cannot safely handle every Animal.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-compatibility-solution","title":"Compare your solution","body":"```ts\ninterface A { id: string }\ninterface B { id: string }\nconst b: B = { id: \"lesson\" };\nconst a: A = b;\ntype Animal = { name: string };\ntype Dog = Animal & { bark(): void };\nconst dogsOnly = (dog: Dog) => dog.bark();\n// @ts-expect-error some Animals cannot bark\nconst animals: (animal: Animal) => void = dogsOnly;\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-compatibility-takeaway","title":"Keep this in mind","body":"Variance annotations in/out are advanced tools, not a way to override structural compatibility. Mixins use class-expression factories with constructor constraints; simple function composition is often easier to maintain.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-classes-quiz","type":"quiz","title":"Skill check · Classes, compatibility, and composition","skill":"Classes, compatibility, and composition","questions":[{"id":"ts-sec-classes-quiz-q1","prompt":"Does implements create the interface’s methods?","options":["No, the class must implement them","Yes, with empty bodies","Only when methods are public"],"answer":0,"explanation":"implements is a compatibility check, not code generation."},{"id":"ts-sec-classes-quiz-q2","prompt":"Which offers JavaScript runtime privacy?","options":["TypeScript private alone","readonly field","#field"],"answer":2,"explanation":"#private fields have runtime access restrictions; TypeScript private is primarily static."},{"id":"ts-sec-classes-quiz-q3","prompt":"Can a handler requiring Dog safely substitute for a handler accepting every Animal?","options":["Always under strictFunctionTypes","No; some Animals cannot bark","Yes, because Dog has more properties"],"answer":1,"explanation":"The caller may pass an Animal that is not a Dog, so the narrower callback is unsafe."}],"sources":[{"title":"Classes","url":"https://www.typescriptlang.org/docs/handbook/2/classes.html"},{"title":"Type Compatibility","url":"https://www.typescriptlang.org/docs/handbook/type-compatibility.html"},{"title":"Mixins","url":"https://www.typescriptlang.org/docs/handbook/mixins.html"},{"title":"MDN: Classes","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_classes"}]}],"sources":[{"title":"Classes","url":"https://www.typescriptlang.org/docs/handbook/2/classes.html"},{"title":"Type Compatibility","url":"https://www.typescriptlang.org/docs/handbook/type-compatibility.html"},{"title":"Mixins","url":"https://www.typescriptlang.org/docs/handbook/mixins.html"},{"title":"MDN: Classes","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_classes"}],"studyGuide":{"title":"12 · Classes, compatibility, and composition · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["A definite-assignment assertion (!) suppresses an initialization check; it does not initialize the field. Check JavaScript this binding when passing instance methods.","Variance annotations in/out are advanced tools, not a way to override structural compatibility. Mixins use class-expression factories with constructor constraints; simple function composition is often easier to maintain."]}},{"id":"ts-sec-modules","type":"section","title":"13 · Modules and runtime-aware resolution","children":[{"id":"ts-lesson-module-boundaries","type":"slides","title":"ES modules, type imports, and CommonJS","minutes":15,"objectives":["Distinguish runtime imports from type-only dependencies."],"sources":[{"title":"Modules","url":"https://www.typescriptlang.org/docs/handbook/2/modules.html"},{"title":"Module theory","url":"https://www.typescriptlang.org/docs/handbook/modules/theory.html"},{"title":"Module reference","url":"https://www.typescriptlang.org/docs/handbook/modules/reference.html"},{"title":"Choosing module options","url":"https://www.typescriptlang.org/docs/handbook/modules/guides/choosing-compiler-options.html"},{"title":"MDN: Modules","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules"}],"slides":[{"id":"ts-lesson-module-boundaries-concept","title":"ES modules, type imports, and CommonJS","body":"YOUR GOAL\nDistinguish runtime imports from type-only dependencies.\n\nA file with module syntax normally has its own scope. export {} can make a file a module without exporting a value. import type is erased and cannot be used as a runtime value. ESM and CommonJS use different loading and interop rules. package.json type and file extensions influence Node module format."},{"id":"ts-lesson-module-boundaries-example","title":"Read the code","body":"```ts\n// model.ts\nexport type Lesson = { id: string; title: string };\nexport const version = 1;\n\n// usage.ts (separate file)\n// import { version, type Lesson } from \"./model.js\";\n// const lesson: Lesson = { id: \"a\", title: \"Modules\" };\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-module-boundaries-practice","title":"Try it yourself","body":"Split a Lesson type and a formatter into two files. Import only the type where no runtime value is needed. Inspect the output to confirm that the type import disappears.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-module-boundaries-solution","title":"Compare your solution","body":"```ts\n// model.ts\nexport type Lesson = { title: string };\n\n// formatter.ts (separate file)\n// import type { Lesson } from \"./model.js\";\n// export function format(lesson: Lesson) { return lesson.title; }\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-module-boundaries-takeaway","title":"Keep this in mind","body":"Module specifiers must work in the actual host. A path the checker understands is not automatically a path the runtime understands. Multi-file examples are labeled and need separate files.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-resolution","type":"slides","title":"Choose module settings for the host","minutes":15,"objectives":["Diagnose a module that type-checks but fails to load."],"sources":[{"title":"Modules","url":"https://www.typescriptlang.org/docs/handbook/2/modules.html"},{"title":"Module theory","url":"https://www.typescriptlang.org/docs/handbook/modules/theory.html"},{"title":"Module reference","url":"https://www.typescriptlang.org/docs/handbook/modules/reference.html"},{"title":"Choosing module options","url":"https://www.typescriptlang.org/docs/handbook/modules/guides/choosing-compiler-options.html"},{"title":"MDN: Modules","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules"}],"slides":[{"id":"ts-lesson-resolution-concept","title":"Choose module settings for the host","body":"YOUR GOAL\nDiagnose a module that type-checks but fails to load.\n\nTypeScript imitates a host’s resolution to find code and declarations. For Node ESM, use a compatible Node module mode and valid emitted import specifiers. For bundler-managed apps, bundler resolution with preserve or an appropriate ES module output may fit. paths does not rewrite emitted imports. package exports, imports and type conditions affect package resolution."},{"id":"ts-lesson-resolution-example","title":"Read the code","body":"```text\n{\n  \"compilerOptions\": {\n    \"module\": \"NodeNext\",\n    \"moduleResolution\": \"NodeNext\",\n    \"target\": \"ES2022\",\n    \"strict\": true,\n    \"outDir\": \"dist\"\n  }\n}\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-resolution-practice","title":"Try it yourself","body":"Compare a Node ESM project and a bundler app. Identify which tool executes or bundles the output. Explain why adding paths: { \"@/*\": [\"src/*\"] } alone cannot teach Node to load @/lesson.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-resolution-solution","title":"Compare your solution","body":"```text\nNode ESM: use a matching Node module mode, package.json \"type\": \"module\", and runtime-valid relative import extensions.\n\nBundler app: use moduleResolution \"bundler\" with module \"preserve\" or the documented ES module mode supported by the tool. Configure aliases in the bundler as well.\n\nDebug with: npx tsc -p tsconfig.json --traceResolution\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-resolution-takeaway","title":"Keep this in mind","body":"Use the host-specific guide before copying tsconfig options. esModuleInterop affects some emit and checking behavior; it does not make every runtime interop pattern equivalent.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-modules-quiz","type":"quiz","title":"Skill check · Modules and runtime-aware resolution","skill":"Modules and runtime-aware resolution","questions":[{"id":"ts-sec-modules-quiz-q1","prompt":"Does paths rewrite JavaScript import specifiers?","options":["Always","Only when aliases start with @","No"],"answer":2,"explanation":"paths informs resolution for checking. Configure the runtime or bundler separately."},{"id":"ts-sec-modules-quiz-q2","prompt":"What happens to import type in JavaScript output?","options":["It validates the imported object","It is erased","It becomes require()"],"answer":1,"explanation":"A type-only import has no runtime value import."},{"id":"ts-sec-modules-quiz-q3","prompt":"What should drive module and moduleResolution choices?","options":["The actual runtime or bundler host","The shortest config","Whether the project uses interfaces"],"answer":0,"explanation":"The checker and output must agree with how the host loads modules."}],"sources":[{"title":"Modules","url":"https://www.typescriptlang.org/docs/handbook/2/modules.html"},{"title":"Module theory","url":"https://www.typescriptlang.org/docs/handbook/modules/theory.html"},{"title":"Module reference","url":"https://www.typescriptlang.org/docs/handbook/modules/reference.html"},{"title":"Choosing module options","url":"https://www.typescriptlang.org/docs/handbook/modules/guides/choosing-compiler-options.html"},{"title":"MDN: Modules","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules"}]}],"sources":[{"title":"Modules","url":"https://www.typescriptlang.org/docs/handbook/2/modules.html"},{"title":"Module theory","url":"https://www.typescriptlang.org/docs/handbook/modules/theory.html"},{"title":"Module reference","url":"https://www.typescriptlang.org/docs/handbook/modules/reference.html"},{"title":"Choosing module options","url":"https://www.typescriptlang.org/docs/handbook/modules/guides/choosing-compiler-options.html"},{"title":"MDN: Modules","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules"}],"studyGuide":{"title":"13 · Modules and runtime-aware resolution · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["Module specifiers must work in the actual host. A path the checker understands is not automatically a path the runtime understands. Multi-file examples are labeled and need separate files.","Use the host-specific guide before copying tsconfig options. esModuleInterop affects some emit and checking behavior; it does not make every runtime interop pattern equivalent."]}},{"id":"ts-sec-configuration","type":"section","title":"14 · Compiler options and scalable projects","children":[{"id":"ts-lesson-strict-config","type":"slides","title":"Strictness, targets, libraries, and emit","minutes":15,"objectives":["Read compiler configuration as a set of concrete decisions."],"sources":[{"title":"tsconfig.json","url":"https://www.typescriptlang.org/docs/handbook/tsconfig-json.html"},{"title":"Compiler CLI","url":"https://www.typescriptlang.org/docs/handbook/compiler-options.html"},{"title":"Project References","url":"https://www.typescriptlang.org/docs/handbook/project-references.html"},{"title":"Watch configuration","url":"https://www.typescriptlang.org/docs/handbook/configuring-watch.html"},{"title":"TSConfig Reference","url":"https://www.typescriptlang.org/tsconfig/"}],"slides":[{"id":"ts-lesson-strict-config-concept","title":"Strictness, targets, libraries, and emit","body":"YOUR GOAL\nRead compiler configuration as a set of concrete decisions.\n\ntarget controls output syntax and default library choices; lib controls available API declarations. Neither adds a runtime polyfill. strict is a family of checks; noUncheckedIndexedAccess and exactOptionalPropertyTypes are separate useful choices. noEmit, noEmitOnError, declaration, sourceMap, rootDir and outDir affect output. include/exclude select root files, but imports can bring excluded files into a program."},{"id":"ts-lesson-strict-config-example","title":"Read the code","body":"```text\n{\n  \"compilerOptions\": {\n    \"target\": \"ES2022\",\n    \"lib\": [\"ES2022\", \"DOM\"],\n    \"strict\": true,\n    \"noUncheckedIndexedAccess\": true,\n    \"exactOptionalPropertyTypes\": true,\n    \"noEmit\": true\n  },\n  \"include\": [\"src/**/*.ts\"]\n}\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-strict-config-practice","title":"Try it yourself","body":"Turn on noUncheckedIndexedAccess and inspect an array index. With exactOptionalPropertyTypes enabled, compare an absent optional property with a present property set to undefined. Explain what lib does not install.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-strict-config-solution","title":"Compare your solution","body":"```text\ntype Settings = { title?: string };\nconst missing: Settings = {};\n// Under exactOptionalPropertyTypes this needs title?: string | undefined:\n// const present: Settings = { title: undefined };\nconst items: string[] = [];\nconst first: string | undefined = items[0];\nconsole.log(first ?? \"No item\");\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-strict-config-takeaway","title":"Keep this in mind","body":"Passing compilation does not guarantee platform APIs exist. Treat skipLibCheck as a tradeoff, not a way to fix mismatched declarations. Avoid suppressions before understanding the diagnostic.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-build-workflow","type":"slides","title":"Build tools, watch mode, and project references","minutes":15,"objectives":["Keep transpilation, type checking, and multi-project builds coordinated."],"sources":[{"title":"tsconfig.json","url":"https://www.typescriptlang.org/docs/handbook/tsconfig-json.html"},{"title":"Compiler CLI","url":"https://www.typescriptlang.org/docs/handbook/compiler-options.html"},{"title":"Project References","url":"https://www.typescriptlang.org/docs/handbook/project-references.html"},{"title":"Watch configuration","url":"https://www.typescriptlang.org/docs/handbook/configuring-watch.html"},{"title":"TSConfig Reference","url":"https://www.typescriptlang.org/tsconfig/"}],"slides":[{"id":"ts-lesson-build-workflow-concept","title":"Build tools, watch mode, and project references","body":"YOUR GOAL\nKeep transpilation, type checking, and multi-project builds coordinated.\n\nBabel and many fast bundlers can remove types without checking them. Run tsc separately in CI. Watch mode repeats checks on changes. Incremental builds reuse work. Project references split larger systems into composite projects; build mode orders dependencies and uses declaration outputs. They are useful when boundaries justify the extra configuration."},{"id":"ts-lesson-build-workflow-example","title":"Read the code","body":"```text\nnpx tsc -p tsconfig.json --noEmit\nnpx tsc -p tsconfig.json --watch\nnpx tsc -b\nnpx tsc -b --clean\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-build-workflow-practice","title":"Try it yourself","body":"Design two packages, domain and app. App references domain. Write a solution config and state what composite and declaration outputs provide. Also name the command CI should run if a bundler emits the app.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-build-workflow-solution","title":"Compare your solution","body":"```text\n// solution tsconfig.json\n{ \"files\": [], \"references\": [{ \"path\": \"./domain\" }, { \"path\": \"./app\" }] }\n\n// app tsconfig.json references domain; referenced projects enable composite.\n// Build dependency projects: npx tsc -b\n// For a bundler app, also run an appropriate separate type-check script in CI.\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-build-workflow-takeaway","title":"Keep this in mind","body":"Watch settings tune how changes are detected, not the type system. MSBuild, Gulp and framework-specific recipes are optional integration references, not prerequisites for every learner.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-configuration-quiz","type":"quiz","title":"Skill check · Compiler options and scalable projects","skill":"Compiler options and scalable projects","questions":[{"id":"ts-sec-configuration-quiz-q1","prompt":"Does lib: [\"ES2022\", \"DOM\"] install those APIs into a runtime?","options":["Only with target ES2022","No; it supplies declarations","Yes, it polyfills them"],"answer":1,"explanation":"lib controls static API knowledge. Actual runtime support is separate."},{"id":"ts-sec-configuration-quiz-q2","prompt":"Does strict include noUncheckedIndexedAccess?","options":["No, configure it separately","Yes, always","Only for readonly arrays"],"answer":0,"explanation":"Some additional safety flags are not part of the strict family."},{"id":"ts-sec-configuration-quiz-q3","prompt":"What should accompany a transpile-only bundler?","options":["Nothing; removing types proves correctness","Only source maps","A separate type-check command"],"answer":2,"explanation":"Run tsc or a suitable checker separately so build success does not hide type errors."}],"sources":[{"title":"tsconfig.json","url":"https://www.typescriptlang.org/docs/handbook/tsconfig-json.html"},{"title":"Compiler CLI","url":"https://www.typescriptlang.org/docs/handbook/compiler-options.html"},{"title":"Project References","url":"https://www.typescriptlang.org/docs/handbook/project-references.html"},{"title":"Watch configuration","url":"https://www.typescriptlang.org/docs/handbook/configuring-watch.html"},{"title":"TSConfig Reference","url":"https://www.typescriptlang.org/tsconfig/"}]}],"sources":[{"title":"tsconfig.json","url":"https://www.typescriptlang.org/docs/handbook/tsconfig-json.html"},{"title":"Compiler CLI","url":"https://www.typescriptlang.org/docs/handbook/compiler-options.html"},{"title":"Project References","url":"https://www.typescriptlang.org/docs/handbook/project-references.html"},{"title":"Watch configuration","url":"https://www.typescriptlang.org/docs/handbook/configuring-watch.html"},{"title":"TSConfig Reference","url":"https://www.typescriptlang.org/tsconfig/"}],"studyGuide":{"title":"14 · Compiler options and scalable projects · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["Passing compilation does not guarantee platform APIs exist. Treat skipLibCheck as a tradeoff, not a way to fix mismatched declarations. Avoid suppressions before understanding the diagnostic.","Watch settings tune how changes are detected, not the type system. MSBuild, Gulp and framework-specific recipes are optional integration references, not prerequisites for every learner."]}},{"id":"ts-sec-declarations","type":"section","title":"15 · Consume and publish declaration files","children":[{"id":"ts-lesson-consume-types","type":"slides","title":"Find and describe library types","minutes":15,"objectives":["Explain what a declaration file promises and what it cannot supply."],"sources":[{"title":"Type Declarations","url":"https://www.typescriptlang.org/docs/handbook/2/type-declarations.html"},{"title":"Writing declarations","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/introduction.html"},{"title":"Declarations by example","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/by-example.html"},{"title":"Library structures","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/library-structures.html"},{"title":"Publishing declarations","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/publishing.html"},{"title":"Declaration guidelines","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/do-s-and-don-ts.html"}],"slides":[{"id":"ts-lesson-consume-types-concept","title":"Find and describe library types","body":"YOUR GOAL\nExplain what a declaration file promises and what it cannot supply.\n\nA .d.ts file describes an existing implementation; it does not implement one. Types may be built in, bundled with a package, installed through @types, or authored locally. declare describes a value expected at runtime. A blanket declare module can hide mistakes by turning a module into any."},{"id":"ts-lesson-consume-types-example","title":"Read the code","body":"```ts\n// Example declarations for an existing runtime library:\nexport interface Lesson { id: string; title: string }\nexport declare function findLesson(id: string): Lesson | undefined;\nexport declare class Catalog {\n  constructor(initial: Lesson[]);\n  find(id: string): Lesson | undefined;\n}\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-consume-types-practice","title":"Try it yourself","body":"Describe an existing library function formatMinutes(number): string in a .d.ts file. Explain what else must exist for importing it to work at runtime. Check whether your actual library already bundles types before installing @types.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-consume-types-solution","title":"Compare your solution","body":"```ts\n// index.d.ts; pairs with an actual runtime index.js implementation\nexport declare function formatMinutes(minutes: number): string;\n\n// Declarations tell the checker the signature.\n// The package still needs JavaScript that exports formatMinutes.\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-consume-types-takeaway","title":"Keep this in mind","body":"A declaration mismatch can make incorrect code compile. Validate declarations against actual behavior, including missing values, overloads and callback invocation rules.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-publish-types","type":"slides","title":"Generate, package, and test declarations","minutes":15,"objectives":["Keep a library’s JavaScript and public type surface aligned."],"sources":[{"title":"Type Declarations","url":"https://www.typescriptlang.org/docs/handbook/2/type-declarations.html"},{"title":"Writing declarations","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/introduction.html"},{"title":"Declarations by example","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/by-example.html"},{"title":"Library structures","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/library-structures.html"},{"title":"Publishing declarations","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/publishing.html"},{"title":"Declaration guidelines","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/do-s-and-don-ts.html"}],"slides":[{"id":"ts-lesson-publish-types-concept","title":"Generate, package, and test declarations","body":"YOUR GOAL\nKeep a library’s JavaScript and public type surface aligned.\n\nGenerate declarations from implementation when possible. Set package metadata so consumers can find them; modern exports may need type conditions alongside runtime paths. Dependencies exposed by public declarations must be available to consumers. Global, module, callable, class and plugin libraries need matching declaration structures. Declaration merging and augmentation extend existing contracts, not runtime behavior."},{"id":"ts-lesson-publish-types-example","title":"Read the code","body":"```text\n{\n  \"compilerOptions\": {\n    \"strict\": true,\n    \"declaration\": true,\n    \"declarationMap\": true,\n    \"outDir\": \"dist\"\n  }\n}\n\n// package.json can point \"types\" at \"./dist/index.d.ts\".\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-publish-types-practice","title":"Try it yourself","body":"Write an interface twice with compatible additional members to see declaration merging. Then describe a publishing checklist: runtime entry, type entry, dependent types, and a consumer compile test.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-publish-types-solution","title":"Compare your solution","body":"```text\ninterface CourseOptions { title: string }\ninterface CourseOptions { sequential?: boolean }\nconst options: CourseOptions = { title: \"Types\", sequential: true };\n\n// Consumer checklist: resolve package entry and types; import a public API;\n// verify valid calls compile and invalid calls fail; run runtime smoke tests.\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-publish-types-takeaway","title":"Keep this in mind","body":"Module augmentation names an existing module and must obey merging rules. It cannot create working runtime members by itself. Use declaration templates matching how the library is actually loaded.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-declarations-quiz","type":"quiz","title":"Skill check · Consume and publish declaration files","skill":"Consume and publish declaration files","questions":[{"id":"ts-sec-declarations-quiz-q1","prompt":"What does a .d.ts file provide?","options":["Type information without a JavaScript implementation","A complete runtime implementation","A runtime schema validator"],"answer":0,"explanation":"Declarations describe existing values and APIs. They do not emit the implementation."},{"id":"ts-sec-declarations-quiz-q2","prompt":"Should public declaration dependencies be available to consumers?","options":["No, devDependencies always suffice","Only during the author’s build","Yes"],"answer":2,"explanation":"If exported types reference another package, consumers need its declarations to resolve."},{"id":"ts-sec-declarations-quiz-q3","prompt":"Does declaration merging add runtime methods?","options":["Only for interfaces","No","Yes, as empty functions"],"answer":1,"explanation":"Merging combines static declarations, while runtime behavior needs actual code."}],"sources":[{"title":"Type Declarations","url":"https://www.typescriptlang.org/docs/handbook/2/type-declarations.html"},{"title":"Writing declarations","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/introduction.html"},{"title":"Declarations by example","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/by-example.html"},{"title":"Library structures","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/library-structures.html"},{"title":"Publishing declarations","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/publishing.html"},{"title":"Declaration guidelines","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/do-s-and-don-ts.html"}]}],"sources":[{"title":"Type Declarations","url":"https://www.typescriptlang.org/docs/handbook/2/type-declarations.html"},{"title":"Writing declarations","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/introduction.html"},{"title":"Declarations by example","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/by-example.html"},{"title":"Library structures","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/library-structures.html"},{"title":"Publishing declarations","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/publishing.html"},{"title":"Declaration guidelines","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/do-s-and-don-ts.html"}],"studyGuide":{"title":"15 · Consume and publish declaration files · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["A declaration mismatch can make incorrect code compile. Validate declarations against actual behavior, including missing values, overloads and callback invocation rules.","Module augmentation names an existing module and must obey merging rules. It cannot create working runtime members by itself. Use declaration templates matching how the library is actually loaded."]}},{"id":"ts-sec-migration","type":"section","title":"16 · Adopt TypeScript in JavaScript projects","children":[{"id":"ts-lesson-jsdoc","type":"slides","title":"Check JavaScript using JSDoc","minutes":15,"objectives":["Add useful checking before renaming every file."],"sources":[{"title":"TypeScript in JavaScript","url":"https://www.typescriptlang.org/docs/handbook/intro-to-js-ts.html"},{"title":"JSDoc Reference","url":"https://www.typescriptlang.org/docs/handbook/jsdoc-supported-types.html"},{"title":"Checking JavaScript","url":"https://www.typescriptlang.org/docs/handbook/type-checking-javascript-files.html"},{"title":"Migration","url":"https://www.typescriptlang.org/docs/handbook/migrating-from-javascript.html"},{"title":"Declarations from JavaScript","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/dts-from-js.html"}],"slides":[{"id":"ts-lesson-jsdoc-concept","title":"Check JavaScript using JSDoc","body":"YOUR GOAL\nAdd useful checking before renaming every file.\n\nallowJs includes JavaScript in a project. checkJs or @ts-check enables diagnostics for it. JSDoc can describe parameters, results, object shapes, imports and generic relationships. JavaScript inference has some different rules from .ts files; review the JS checking reference instead of assuming identical behavior."},{"id":"ts-lesson-jsdoc-example","title":"Read the code","body":"```js\n// @ts-check\n/**\n * @param {number} minutes\n * @returns {string}\n */\nfunction label(minutes) { return `${minutes} min`; }\nconsole.log(label(10));\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-jsdoc-practice","title":"Try it yourself","body":"Create a .js file with @ts-check. Define a Lesson typedef containing title and minutes. Annotate a function taking that Lesson. Introduce an invalid argument and confirm a diagnostic.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-jsdoc-solution","title":"Compare your solution","body":"```js\n// @ts-check\n/** @typedef {{ title: string, minutes: number }} Lesson */\n/** @param {Lesson} lesson */\nfunction summary(lesson) { return `${lesson.title}: ${lesson.minutes}`; }\nsummary({ title: \"Types\", minutes: 10 });\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-jsdoc-takeaway","title":"Keep this in mind","body":"JSDoc offers @template, @satisfies, imported types and many other tags. Use the supported-tag reference; not every documentation tag changes checking.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-incremental-migration","type":"slides","title":"Migrate boundaries and manage escape hatches","minutes":15,"objectives":["Improve checking without hiding every diagnostic."],"sources":[{"title":"TypeScript in JavaScript","url":"https://www.typescriptlang.org/docs/handbook/intro-to-js-ts.html"},{"title":"JSDoc Reference","url":"https://www.typescriptlang.org/docs/handbook/jsdoc-supported-types.html"},{"title":"Checking JavaScript","url":"https://www.typescriptlang.org/docs/handbook/type-checking-javascript-files.html"},{"title":"Migration","url":"https://www.typescriptlang.org/docs/handbook/migrating-from-javascript.html"},{"title":"Declarations from JavaScript","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/dts-from-js.html"}],"slides":[{"id":"ts-lesson-incremental-migration-concept","title":"Migrate boundaries and manage escape hatches","body":"YOUR GOAL\nImprove checking without hiding every diagnostic.\n\nMigrate in small slices. Start with shared domain types and external-data boundaries, then strengthen checks. Use unknown and runtime validation for uncertainty. @ts-expect-error is useful for intentional negative tests because it reports when the expected error disappears; @ts-ignore does not. Avoid large any regions and blanket @ts-nocheck."},{"id":"ts-lesson-incremental-migration-example","title":"Read the code","body":"```text\nfunction minutesLabel(minutes: number): string { return `${minutes} min`; }\n// Intentional negative type test; do not run this as application behavior.\n// @ts-expect-error minutes must be numeric\nminutesLabel(\"10\");\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-incremental-migration-practice","title":"Try it yourself","body":"Choose one JavaScript module and identify its inputs, outputs and dependencies. Write a migration plan that includes baseline runtime tests, checkJs, conversion to .ts, and strict checking. Fix mismatches rather than casting every error away.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-incremental-migration-solution","title":"Compare your solution","body":"```text\n1. Record current behavior with meaningful tests.\n2. Enable checking for the selected JS module and annotate its boundaries.\n3. Validate external data and replace accidental any.\n4. Rename the selected module to .ts and correct import/build configuration.\n5. Run strict type checking and runtime tests; inspect changes before expanding.\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-incremental-migration-takeaway","title":"Keep this in mind","body":"Generating .d.ts files from JS can help library consumers without converting implementation files. A migration should preserve behavior while improving the contracts you can verify.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-migration-quiz","type":"quiz","title":"Skill check · Adopt TypeScript in JavaScript projects","skill":"Adopt TypeScript in JavaScript projects","questions":[{"id":"ts-sec-migration-quiz-q1","prompt":"Which setting enables diagnostics in included JavaScript files?","options":["allowJs alone always checks every error","declarationMap","checkJs"],"answer":2,"explanation":"allowJs includes files; checkJs enables checking. @ts-check can opt in per file."},{"id":"ts-sec-migration-quiz-q2","prompt":"Why use @ts-expect-error for an intentional negative type test?","options":["It suppresses the entire file","It reports when the expected error disappears","It validates runtime behavior"],"answer":1,"explanation":"An unused expect-error directive is itself a diagnostic, which helps maintain negative tests."},{"id":"ts-sec-migration-quiz-q3","prompt":"What is a useful early migration boundary?","options":["Untrusted inputs and shared domain contracts","Every file annotated any","All diagnostics disabled"],"answer":0,"explanation":"Boundary contracts limit the spread of uncertainty and give incremental migration practical value."}],"sources":[{"title":"TypeScript in JavaScript","url":"https://www.typescriptlang.org/docs/handbook/intro-to-js-ts.html"},{"title":"JSDoc Reference","url":"https://www.typescriptlang.org/docs/handbook/jsdoc-supported-types.html"},{"title":"Checking JavaScript","url":"https://www.typescriptlang.org/docs/handbook/type-checking-javascript-files.html"},{"title":"Migration","url":"https://www.typescriptlang.org/docs/handbook/migrating-from-javascript.html"},{"title":"Declarations from JavaScript","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/dts-from-js.html"}]}],"sources":[{"title":"TypeScript in JavaScript","url":"https://www.typescriptlang.org/docs/handbook/intro-to-js-ts.html"},{"title":"JSDoc Reference","url":"https://www.typescriptlang.org/docs/handbook/jsdoc-supported-types.html"},{"title":"Checking JavaScript","url":"https://www.typescriptlang.org/docs/handbook/type-checking-javascript-files.html"},{"title":"Migration","url":"https://www.typescriptlang.org/docs/handbook/migrating-from-javascript.html"},{"title":"Declarations from JavaScript","url":"https://www.typescriptlang.org/docs/handbook/declaration-files/dts-from-js.html"}],"studyGuide":{"title":"16 · Adopt TypeScript in JavaScript projects · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["JSDoc offers @template, @satisfies, imported types and many other tags. Use the supported-tag reference; not every documentation tag changes checking.","Generating .d.ts files from JS can help library consumers without converting implementation files. A migration should preserve behavior while improving the contracts you can verify."]}},{"id":"ts-sec-async-dom","type":"section","title":"17 · Async data and browser applications","children":[{"id":"ts-lesson-async-validation","type":"slides","title":"Promises, errors, and validated API data","minutes":15,"objectives":["Handle both network failures and invalid payloads."],"sources":[{"title":"MDN: Promises","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_promises"},{"title":"DOM Manipulation","url":"https://www.typescriptlang.org/docs/handbook/dom-manipulation.html"},{"title":"Runtime guards","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html"},{"title":"MDN: Fetching data","url":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Network_requests"}],"slides":[{"id":"ts-lesson-async-validation-concept","title":"Promises, errors, and validated API data","body":"YOUR GOAL\nHandle both network failures and invalid payloads.\n\nAn async function returns a Promise. Promise\u003cT> describes the success value, not a typed rejection channel. Fetch can resolve for HTTP errors, so check response.ok. Treat parsed JSON as unknown and validate its fields. Catch variables under strict checking are unknown and need narrowing."},{"id":"ts-lesson-async-validation-example","title":"Read the code","body":"```ts\ntype Lesson = { title: string };\nfunction isLesson(value: unknown): value is Lesson {\n  return typeof value === \"object\" && value !== null\n    && \"title\" in value && typeof value.title === \"string\";\n}\nasync function loadLesson(url: string): Promise\u003cLesson> {\n  const response = await fetch(url);\n  if (!response.ok) throw new Error(`HTTP ${response.status}`);\n  const data: unknown = await response.json();\n  if (!isLesson(data)) throw new Error(\"Invalid lesson\");\n  return data;\n}\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-async-validation-practice","title":"Try it yourself","body":"Wrap a load call in try/catch. Produce a readable error message without assuming the thrown value is an Error. Identify how you would test HTTP failure and a successful response with invalid JSON shape.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-async-validation-solution","title":"Compare your solution","body":"```ts\nasync function run(): Promise\u003cvoid> {\n  try {\n    const response = await fetch(\"/lesson.json\");\n    if (!response.ok) throw new Error(`HTTP ${response.status}`);\n    const data: unknown = await response.json();\n    console.log(data); // validate before domain use\n  } catch (error: unknown) {\n    const message = error instanceof Error ? error.message : \"Unknown failure\";\n    console.error(message);\n  }\n}\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-async-validation-takeaway","title":"Keep this in mind","body":"A return annotation Promise\u003cLesson> does not validate response.json(). Test malformed fields, missing fields, null, HTTP errors and rejected network requests.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-dom-events","type":"slides","title":"DOM nullability, element types, and events","minutes":15,"objectives":["Use browser elements without unsafe assumptions."],"sources":[{"title":"MDN: Promises","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_promises"},{"title":"DOM Manipulation","url":"https://www.typescriptlang.org/docs/handbook/dom-manipulation.html"},{"title":"Runtime guards","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html"},{"title":"MDN: Fetching data","url":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Network_requests"}],"slides":[{"id":"ts-lesson-dom-events-concept","title":"DOM nullability, element types, and events","body":"YOUR GOAL\nUse browser elements without unsafe assumptions.\n\nA DOM query may return null and may select an unexpected element type. Narrow with instanceof when markup could differ. Event target is a general EventTarget, not necessarily an input. Typed querySelector overloads can help known tags, but a generic annotation alone does not verify the actual element."},{"id":"ts-lesson-dom-events-example","title":"Read the code","body":"```ts\nconst field = document.querySelector(\"#title\");\nif (field instanceof HTMLInputElement) {\n  field.addEventListener(\"input\", () => {\n    console.log(field.value);\n  });\n}\nconst button = document.createElement(\"button\");\nbutton.textContent = \"Save\";\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-dom-events-practice","title":"Try it yourself","body":"Query #minutes. Verify it is an HTMLInputElement, read valueAsNumber, and reject NaN. Explain why document.getElementById(\"minutes\")! is not enough evidence.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-dom-events-solution","title":"Compare your solution","body":"```ts\nconst input = document.getElementById(\"minutes\");\nif (input instanceof HTMLInputElement) {\n  const minutes = input.valueAsNumber;\n  if (Number.isFinite(minutes)) console.log(minutes);\n  else console.error(\"Enter a number\");\n}\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-dom-events-takeaway","title":"Keep this in mind","body":"Non-null assertions do not check elements at runtime. Use textContent for text rather than injecting untrusted markup. DOM lib declarations do not make document exist in Node.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-async-dom-quiz","type":"quiz","title":"Skill check · Async data and browser applications","skill":"Async data and browser applications","questions":[{"id":"ts-sec-async-dom-quiz-q1","prompt":"Does fetch reject automatically for every HTTP 404 response?","options":["Only with a Promise annotation","No; inspect response.ok or status","Yes"],"answer":1,"explanation":"HTTP error responses can resolve normally; network failures are a separate failure path."},{"id":"ts-sec-async-dom-quiz-q2","prompt":"Does Promise\u003cLesson> validate parsed JSON?","options":["No","Yes, recursively","Only if Lesson is an interface"],"answer":0,"explanation":"The annotation is static. Parsed external input needs runtime validation."},{"id":"ts-sec-async-dom-quiz-q3","prompt":"What is a robust check before accessing an uncertain element’s value?","options":["element! alone","element as HTMLInputElement always validates it","element instanceof HTMLInputElement"],"answer":2,"explanation":"instanceof establishes runtime element identity and narrows its type."}],"sources":[{"title":"MDN: Promises","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_promises"},{"title":"DOM Manipulation","url":"https://www.typescriptlang.org/docs/handbook/dom-manipulation.html"},{"title":"Runtime guards","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html"},{"title":"MDN: Fetching data","url":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Network_requests"}]}],"sources":[{"title":"MDN: Promises","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_promises"},{"title":"DOM Manipulation","url":"https://www.typescriptlang.org/docs/handbook/dom-manipulation.html"},{"title":"Runtime guards","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html"},{"title":"MDN: Fetching data","url":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Network_requests"}],"studyGuide":{"title":"17 · Async data and browser applications · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["A return annotation Promise\u003cLesson> does not validate response.json(). Test malformed fields, missing fields, null, HTTP errors and rejected network requests.","Non-null assertions do not check elements at runtime. Use textContent for text rather than injecting untrusted markup. DOM lib declarations do not make document exist in Node."]}},{"id":"ts-sec-specialized","type":"section","title":"18 · Specialized language and integration features","children":[{"id":"ts-lesson-enum-iterables","type":"slides","title":"Enums, symbols, and generators","minutes":15,"objectives":["Recognize features that have runtime behavior as well as types."],"sources":[{"title":"Enums","url":"https://www.typescriptlang.org/docs/handbook/enums.html"},{"title":"Symbols","url":"https://www.typescriptlang.org/docs/handbook/symbols.html"},{"title":"Iterators","url":"https://www.typescriptlang.org/docs/handbook/iterators-and-generators.html"},{"title":"JSX","url":"https://www.typescriptlang.org/docs/handbook/jsx.html"},{"title":"React integration","url":"https://www.typescriptlang.org/docs/handbook/react.html"},{"title":"Namespaces","url":"https://www.typescriptlang.org/docs/handbook/namespaces.html"},{"title":"Namespaces and Modules","url":"https://www.typescriptlang.org/docs/handbook/namespaces-and-modules.html"},{"title":"Triple-slash directives","url":"https://www.typescriptlang.org/docs/handbook/triple-slash-directives.html"}],"slides":[{"id":"ts-lesson-enum-iterables-concept","title":"Enums, symbols, and generators","body":"YOUR GOAL\nRecognize features that have runtime behavior as well as types.\n\nEnums generally emit an object; numeric enums can include reverse mappings. Literal unions and const objects are alternatives. unique symbol can identify a particular symbol type. Iterables expose Symbol.iterator; for...of reads values while for...in reads enumerable property keys. A generator yields values lazily."},{"id":"ts-lesson-enum-iterables-example","title":"Read the code","body":"```ts\nenum Status { Draft = \"draft\", Published = \"published\" }\nconst key: unique symbol = Symbol(\"lesson\");\nfunction* ids(): Generator\u003cstring, void, unknown> {\n  yield \"intro\";\n  yield \"arrays\";\n}\nfor (const id of ids()) console.log(id);\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-enum-iterables-practice","title":"Try it yourself","body":"Replace an enum with an as const object and derive its value union. Write a generator yielding 1 through 3. Explain why a typed array is different from an array with a TypeScript element annotation.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-enum-iterables-solution","title":"Compare your solution","body":"```ts\nconst Status = { Draft: \"draft\", Published: \"published\" } as const;\ntype StatusValue = typeof Status[keyof typeof Status];\nfunction* count(): Generator\u003cnumber, void, unknown> {\n  for (let n = 1; n \u003c= 3; n++) yield n;\n}\nconsole.log([...count()]);\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-enum-iterables-takeaway","title":"Keep this in mind","body":"const enum in published declarations has consumer pitfalls. Typed arrays such as Uint8Array are runtime binary-data structures; number[] is a general JavaScript array type.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-jsx-legacy","type":"slides","title":"JSX, namespaces, and ambient integrations","minutes":15,"objectives":["Locate the correct integration reference without mixing models."],"sources":[{"title":"Enums","url":"https://www.typescriptlang.org/docs/handbook/enums.html"},{"title":"Symbols","url":"https://www.typescriptlang.org/docs/handbook/symbols.html"},{"title":"Iterators","url":"https://www.typescriptlang.org/docs/handbook/iterators-and-generators.html"},{"title":"JSX","url":"https://www.typescriptlang.org/docs/handbook/jsx.html"},{"title":"React integration","url":"https://www.typescriptlang.org/docs/handbook/react.html"},{"title":"Namespaces","url":"https://www.typescriptlang.org/docs/handbook/namespaces.html"},{"title":"Namespaces and Modules","url":"https://www.typescriptlang.org/docs/handbook/namespaces-and-modules.html"},{"title":"Triple-slash directives","url":"https://www.typescriptlang.org/docs/handbook/triple-slash-directives.html"}],"slides":[{"id":"ts-lesson-jsx-legacy-concept","title":"JSX, namespaces, and ambient integrations","body":"YOUR GOAL\nLocate the correct integration reference without mixing models.\n\nJSX is optional syntax whose meaning depends on a factory or runtime. .tsx files and the jsx compiler option configure transformation; intrinsic elements and component signatures control checking. In TSX, use as assertions rather than angle-bracket assertions. Namespaces and triple-slash directives appear in legacy or ambient integrations; modern module-based applications normally use imports and exports."},{"id":"ts-lesson-jsx-legacy-example","title":"Read the code","body":"```ts\n// A component contract independent of a particular JSX runtime:\ntype LessonCardProps = { title: string; completed: boolean };\nfunction cardLabel(props: LessonCardProps): string {\n  return `${props.title}: ${props.completed ? \"Complete\" : \"Ready\"}`;\n}\n// In a React .tsx project, a component can accept this props shape.\n// Install/configure that project’s React runtime and type declarations.\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-jsx-legacy-practice","title":"Try it yourself","body":"Create a props type for title and an onComplete callback. Explain which parts come from TypeScript and which need the UI library’s runtime. Identify a legacy namespace or triple-slash directive in a dependency and read its matching reference.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-jsx-legacy-solution","title":"Compare your solution","body":"```ts\ntype LessonProps = { title: string; onComplete: (id: string) => void };\nfunction complete(props: LessonProps, id: string): void {\n  props.onComplete(id);\n}\n\n// Ambient dependency reference example in a declaration file:\n// /// \u003creference types=\"node\" />\n// This requests declarations, not a runtime import.\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-jsx-legacy-takeaway","title":"Keep this in mind","body":"TypeScript does not include a React runtime. A namespace is not an ES module import. Match declaration structure and JSX options to the actual integration rather than copying framework-specific recipes blindly.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-specialized-quiz","type":"quiz","title":"Skill check · Specialized language and integration features","skill":"Specialized language and integration features","questions":[{"id":"ts-sec-specialized-quiz-q1","prompt":"Which generally emits JavaScript behavior rather than being fully erased?","options":["An enum declaration","A type alias","An interface"],"answer":0,"explanation":"Enums typically emit a runtime object. Interfaces and aliases are erased."},{"id":"ts-sec-specialized-quiz-q2","prompt":"What does for...of iterate?","options":["Only object property names","Only array indexes as strings","Values produced by an iterable"],"answer":2,"explanation":"for...of uses the iterable protocol; for...in enumerates property keys."},{"id":"ts-sec-specialized-quiz-q3","prompt":"Does TypeScript alone provide React’s runtime?","options":["Only in .tsx files","No","Yes, through JSX types"],"answer":1,"explanation":"TypeScript can check and transform JSX, but the UI runtime is a separate dependency."}],"sources":[{"title":"Enums","url":"https://www.typescriptlang.org/docs/handbook/enums.html"},{"title":"Symbols","url":"https://www.typescriptlang.org/docs/handbook/symbols.html"},{"title":"Iterators","url":"https://www.typescriptlang.org/docs/handbook/iterators-and-generators.html"},{"title":"JSX","url":"https://www.typescriptlang.org/docs/handbook/jsx.html"},{"title":"React integration","url":"https://www.typescriptlang.org/docs/handbook/react.html"},{"title":"Namespaces","url":"https://www.typescriptlang.org/docs/handbook/namespaces.html"},{"title":"Namespaces and Modules","url":"https://www.typescriptlang.org/docs/handbook/namespaces-and-modules.html"},{"title":"Triple-slash directives","url":"https://www.typescriptlang.org/docs/handbook/triple-slash-directives.html"}]}],"sources":[{"title":"Enums","url":"https://www.typescriptlang.org/docs/handbook/enums.html"},{"title":"Symbols","url":"https://www.typescriptlang.org/docs/handbook/symbols.html"},{"title":"Iterators","url":"https://www.typescriptlang.org/docs/handbook/iterators-and-generators.html"},{"title":"JSX","url":"https://www.typescriptlang.org/docs/handbook/jsx.html"},{"title":"React integration","url":"https://www.typescriptlang.org/docs/handbook/react.html"},{"title":"Namespaces","url":"https://www.typescriptlang.org/docs/handbook/namespaces.html"},{"title":"Namespaces and Modules","url":"https://www.typescriptlang.org/docs/handbook/namespaces-and-modules.html"},{"title":"Triple-slash directives","url":"https://www.typescriptlang.org/docs/handbook/triple-slash-directives.html"}],"studyGuide":{"title":"18 · Specialized language and integration features · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["const enum in published declarations has consumer pitfalls. Typed arrays such as Uint8Array are runtime binary-data structures; number[] is a general JavaScript array type.","TypeScript does not include a React runtime. A namespace is not an ES module import. Match declaration structure and JSX options to the actual integration rather than copying framework-specific recipes blindly."]}},{"id":"ts-sec-advanced-runtime","type":"section","title":"19 · Decorators, disposal, and advanced runtime topics","children":[{"id":"ts-lesson-decorator-models","type":"slides","title":"Standard and legacy decorators","minutes":15,"objectives":["Identify the decorator model a project actually uses."],"sources":[{"title":"Standard decorators","url":"https://www.typescriptlang.org/docs/handbook/release-notes/typescript-5-0.html#decorators"},{"title":"Legacy decorators","url":"https://www.typescriptlang.org/docs/handbook/decorators.html"},{"title":"Resource disposal","url":"https://www.typescriptlang.org/docs/handbook/variable-declarations.html#using-declarations"},{"title":"MDN: Resource management","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Resource_management"},{"title":"MDN: Meta-programming","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Meta_programming"},{"title":"MDN: Memory management","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Memory_management"}],"slides":[{"id":"ts-lesson-decorator-models-concept","title":"Standard and legacy decorators","body":"YOUR GOAL\nIdentify the decorator model a project actually uses.\n\nModern TypeScript supports a standard decorator model with target/context arguments and initializer hooks. Older experimentalDecorators APIs use different signatures and rules. Standard decorators do not support legacy parameter decorators or emitDecoratorMetadata in the same way. A decorator can alter runtime behavior; it is not just a type annotation."},{"id":"ts-lesson-decorator-models-example","title":"Read the code","body":"```text\nfunction logged\u003cThis, Args extends unknown[], Return>(\n  original: (this: This, ...args: Args) => Return,\n  context: ClassMethodDecoratorContext\u003cThis, (this: This, ...args: Args) => Return>\n) {\n  return function (this: This, ...args: Args): Return {\n    console.log(String(context.name));\n    return original.apply(this, args);\n  };\n}\nclass Catalog {\n  @logged\n  title(): string { return \"TypeScript\"; }\n}\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-decorator-models-practice","title":"Try it yourself","body":"Read the project’s compiler settings before using a decorator example. Explain why a legacy (target, key, descriptor) method decorator cannot simply be dropped into the standard decorator model. Predict the log for new Catalog().title().\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-decorator-models-solution","title":"Compare your solution","body":"```text\nStandard method decorators receive the original method and a context object.\nA replacement must preserve the receiver, argument and return relationships.\nCalling new Catalog().title() logs \"title\" before returning \"TypeScript\".\n\nLegacy examples require the legacy compiler model. Do not enable flags just to silence an incompatible example.\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-decorator-models-takeaway","title":"Keep this in mind","body":"Decorators can affect initialization and composition order. Use them when a library or repeated runtime behavior warrants them, and test the resulting behavior.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-resource-lifecycle","type":"slides","title":"Resource management and platform behavior","minutes":15,"objectives":["Explain disposal and recognize what types cannot manage for you."],"sources":[{"title":"Standard decorators","url":"https://www.typescriptlang.org/docs/handbook/release-notes/typescript-5-0.html#decorators"},{"title":"Legacy decorators","url":"https://www.typescriptlang.org/docs/handbook/decorators.html"},{"title":"Resource disposal","url":"https://www.typescriptlang.org/docs/handbook/variable-declarations.html#using-declarations"},{"title":"MDN: Resource management","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Resource_management"},{"title":"MDN: Meta-programming","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Meta_programming"},{"title":"MDN: Memory management","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Memory_management"}],"slides":[{"id":"ts-lesson-resource-lifecycle-concept","title":"Resource management and platform behavior","body":"YOUR GOAL\nExplain disposal and recognize what types cannot manage for you.\n\nusing disposes a resource on scope exit through Symbol.dispose. await using awaits asynchronous disposal through Symbol.asyncDispose. The await in await using applies to disposal; awaiting acquisition is a separate expression. Runtime support or polyfills and matching declarations are still needed. Garbage collection is not a substitute for closing external resources."},{"id":"ts-lesson-resource-lifecycle-example","title":"Read the code","body":"```text\n// Illustrative modern-runtime example; requires disposable API support.\nclass Resource {\n  [Symbol.dispose](): void { console.log(\"Closed\"); }\n}\n{\n  using resource = new Resource();\n  console.log(\"Working\");\n}\n// \"Working\", then \"Closed\"\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-resource-lifecycle-practice","title":"Try it yourself","body":"Explain the difference between await using resource = acquire() and await using resource = await acquireAsync(). Then describe a try/finally fallback for closing a resource. Identify where Proxy/Reflect or memory-management knowledge might matter in debugging.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-resource-lifecycle-solution","title":"Compare your solution","body":"```text\nconst resource = { close() { console.log(\"Closed\"); } };\ntry {\n  console.log(\"Working\");\n} finally {\n  resource.close();\n}\n// await using awaits disposal; a separate await awaits asynchronous acquisition.\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-resource-lifecycle-takeaway","title":"Keep this in mind","body":"TypeScript cannot prevent retained references or guarantee external resources close. Treat decorators, disposal and metaprogramming as targeted advanced skills, with actual runtime tests.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-advanced-runtime-quiz","type":"quiz","title":"Skill check · Decorators, disposal, and advanced runtime topics","skill":"Decorators, disposal, and advanced runtime topics","questions":[{"id":"ts-sec-advanced-runtime-quiz-q1","prompt":"Are standard and legacy decorator signatures interchangeable?","options":["Always","Only for methods","No"],"answer":2,"explanation":"They use different APIs and semantics. Match examples to the project’s decorator model."},{"id":"ts-sec-advanced-runtime-quiz-q2","prompt":"What does await using specifically await?","options":["Garbage collection","Asynchronous disposal","Acquisition automatically in every expression"],"answer":1,"explanation":"Awaiting acquisition may require a separate await on the initializer expression."},{"id":"ts-sec-advanced-runtime-quiz-q3","prompt":"Does adding declarations for Symbol.dispose supply missing runtime support?","options":["No","Yes","Only with strict enabled"],"answer":0,"explanation":"Declarations inform the checker. Runtime features or polyfills must exist separately."}],"sources":[{"title":"Standard decorators","url":"https://www.typescriptlang.org/docs/handbook/release-notes/typescript-5-0.html#decorators"},{"title":"Legacy decorators","url":"https://www.typescriptlang.org/docs/handbook/decorators.html"},{"title":"Resource disposal","url":"https://www.typescriptlang.org/docs/handbook/variable-declarations.html#using-declarations"},{"title":"MDN: Resource management","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Resource_management"},{"title":"MDN: Meta-programming","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Meta_programming"},{"title":"MDN: Memory management","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Memory_management"}]}],"sources":[{"title":"Standard decorators","url":"https://www.typescriptlang.org/docs/handbook/release-notes/typescript-5-0.html#decorators"},{"title":"Legacy decorators","url":"https://www.typescriptlang.org/docs/handbook/decorators.html"},{"title":"Resource disposal","url":"https://www.typescriptlang.org/docs/handbook/variable-declarations.html#using-declarations"},{"title":"MDN: Resource management","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Resource_management"},{"title":"MDN: Meta-programming","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Meta_programming"},{"title":"MDN: Memory management","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Memory_management"}],"studyGuide":{"title":"19 · Decorators, disposal, and advanced runtime topics · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["Decorators can affect initialization and composition order. Use them when a library or repeated runtime behavior warrants them, and test the resulting behavior.","TypeScript cannot prevent retained references or guarantee external resources close. Treat decorators, disposal and metaprogramming as targeted advanced skills, with actual runtime tests."]}},{"id":"ts-sec-capstone","type":"section","title":"20 · Build and verify a typed learning catalog","children":[{"id":"ts-lesson-capstone-model","type":"slides","title":"Capstone: design the domain and validate input","minutes":15,"objectives":["Create a typed catalog that rejects malformed data."],"sources":[{"title":"Boundary validation","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html"},{"title":"Generic API relationships","url":"https://www.typescriptlang.org/docs/handbook/2/generics.html"},{"title":"Domain shapes","url":"https://www.typescriptlang.org/docs/handbook/2/objects.html"},{"title":"Module boundaries","url":"https://www.typescriptlang.org/docs/handbook/2/modules.html"}],"slides":[{"id":"ts-lesson-capstone-model-concept","title":"Capstone: design the domain and validate input","body":"YOUR GOAL\nCreate a typed catalog that rejects malformed data.\n\nBuild a small catalog with Lesson { id, title, minutes }, a validator accepting unknown, and a result union separating success from failure. Requirements: reject missing or blank IDs/titles and non-finite or negative minutes; handle null; do not trust a type assertion at the boundary. The examples folder contains a complete reference implementation."},{"id":"ts-lesson-capstone-model-example","title":"Read the code","body":"```ts\ntype Lesson = { id: string; title: string; minutes: number };\ntype Result\u003cT> = { ok: true; value: T } | { ok: false; error: string };\nfunction parseText(input: unknown): Result\u003cstring> {\n  return typeof input === \"string\" && input.trim() !== \"\"\n    ? { ok: true, value: input }\n    : { ok: false, error: \"Expected non-empty text\" };\n}\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-capstone-model-practice","title":"Try it yourself","body":"Implement isLesson(value: unknown): value is Lesson using real checks. Try valid data, null, missing title, NaN, negative minutes and a blank ID. Keep validation separate from display logic.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-capstone-model-solution","title":"Compare your solution","body":"```ts\ntype Lesson = { id: string; title: string; minutes: number };\nfunction isLesson(value: unknown): value is Lesson {\n  return typeof value === \"object\" && value !== null\n    && \"id\" in value && typeof value.id === \"string\" && value.id.trim() !== \"\"\n    && \"title\" in value && typeof value.title === \"string\" && value.title.trim() !== \"\"\n    && \"minutes\" in value && typeof value.minutes === \"number\"\n    && Number.isFinite(value.minutes) && value.minutes >= 0;\n}\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-capstone-model-takeaway","title":"Keep this in mind","body":"Define acceptance criteria before implementation. Duplicate IDs are a catalog-level rule, not an individual Lesson rule; check them when parsing the collection.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper read
