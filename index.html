<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TypeScript fundamentals</title><link rel="stylesheet" href="lms.css"><script src="lms-runtime.js" defer></script></head><body class="lms-export-body"><div id="lms-root"></div><script id="lms-course-data" type="application/json">{"schemaVersion":1,"id":"ts-course-fundamentals","title":"TypeScript fundamentals","description":"A supportive introduction to TypeScript for people who already write JavaScript. Short lessons, plain explanations, and quizzes that tell you why an answer is right.","sections":[{"id":"ts-sec-start","type":"section","title":"01 · Start here","children":[{"id":"ts-lesson-welcome","type":"slides","title":"Welcome to TypeScript","slides":[{"id":"ts-slide-why","title":"JavaScript, with a guide","body":"TypeScript is JavaScript plus a type system. You still write the language you know. The extra annotations describe what shape a value should have, so mismatches show up before the program runs.\n\nA type names a set of values. string means text. number means a numeric value. boolean means true or false."},{"id":"ts-slide-how","title":"How this course helps","body":"Each lesson is a few slides, a short video, or a quiz. Quizzes explain every answer, including the ones you miss, and you can retake them.\n\nNothing here assumes you have used TypeScript before. If you can read a JavaScript function, you can follow along. Take notes on any slide or video lesson. They stay with this course in your browser."},{"id":"ts-slide-pace","title":"Lessons open in order","body":"Review every slide in a lesson, then choose Mark lesson complete. The next lesson stays locked until you do. That lets you practice the completion gate.\n\nThe final quiz opens after every lesson is complete. You need 80% to pass, and retakes are allowed. Progress is saved in this browser."}]}]},{"id":"ts-sec-everyday","type":"section","title":"02 · Types you will use","children":[{"id":"ts-sec-names","type":"section","title":"Names for values","children":[{"id":"ts-lesson-annotate","type":"slides","title":"Annotate values and functions","slides":[{"id":"ts-slide-primitives","title":"Say what a value is","body":"Add a type after a name when you want the compiler to check it.\n\nlet title: string = \"Welcome\";\nlet seats: number = 24;\nconst published: boolean = true;\n\nIf you later write title = 24, TypeScript reports an error. The value and the type stopped agreeing. The annotation is a promise you can read at a glance."},{"id":"ts-slide-collections","title":"Lists remember their items","body":"An array of text can be written string[] or Array<string>. Both mean the same thing: every item is a string.\n\nconst topics: string[] = [\"types\", \"narrowing\", \"generics\"];\ntopics.push(\"functions\");\ntopics.push(3); // Error: number is not assignable to string\n\nThe angle brackets in Array<string> are part of the type. They are not markup."},{"id":"ts-slide-objects","title":"Objects describe a shape","body":"An object type lists the properties you can rely on.\n\nconst lesson: { title: string; minutes: number } = {\n  title: \"Annotate values\",\n  minutes: 8\n};\n\nlesson.title is a string. lesson.minutes is a number. A typo such as lesson.minuts is an error, because that property is not on the shape."},{"id":"ts-slide-functions","title":"Functions publish a contract","body":"Parameter types and a return type make a function's contract visible.\n\nfunction minutesLabel(minutes: number): string {\n  return minutes + \" min\";\n}\n\nCall it with a number. The result is a string. Passing text, or using the result where a number is required, is reported before you run the program."}]},{"id":"ts-quiz-everyday","type":"quiz","title":"Check everyday types","questions":[{"id":"ts-q-annotate","prompt":"What does let seats: number = 24 tell TypeScript?","options":["seats may hold any value","seats should only hold a number","seats is a constant string"],"answer":1,"explanation":"The annotation : number promises that seats holds a numeric value. Assigning text later is a type error, which is the check working for you."},{"id":"ts-q-array","prompt":"Which type describes a list where every item is text?","options":["number","string[]","boolean"],"answer":1,"explanation":"string[] means an array of strings. Array<string> means the same thing. number and boolean each describe a single value, not a list."},{"id":"ts-q-function","prompt":"A function is annotated (minutes: number): string. What does that require?","options":["It accepts any arguments and returns any value","It accepts a number and returns a string","It accepts a string and returns a number"],"answer":1,"explanation":"The parameter type is the input. The type after the parentheses is the return value. Here the input is a number and the result is text."}]}]},{"id":"ts-sec-narrow","type":"section","title":"When a value can vary","children":[{"id":"ts-lesson-unions","type":"slides","title":"Unions and narrowing","slides":[{"id":"ts-slide-union","title":"One value, several allowed types","body":"A union uses | to say a value is one type or another.\n\nlet id: string | number;\nid = \"lesson-1\";\nid = 101;\n\nBoth assignments are allowed. id = true is not, because boolean is outside the union. Reach for a union when a real API really does return more than one kind of value."},{"id":"ts-slide-literal","title":"Literal types name exact values","body":"A literal type is one specific value, not a whole category.\n\ntype Status = \"draft\" | \"published\";\nlet status: Status = \"draft\";\n\n\"draft\" and \"published\" are allowed. \"done\" is not, even though it is a string. Literal unions work well for a small set of known states, such as a lesson that is draft or published."},{"id":"ts-slide-narrow","title":"Narrow before you use a member","body":"After a union, check which member you have. TypeScript then treats the value as that member inside the branch.\n\nfunction label(id: string | number): string {\n  if (typeof id === \"string\") {\n    return id.toUpperCase();\n  }\n  return String(id);\n}\n\nInside the if, id is a string, so toUpperCase is allowed. In the rest of the function, id is a number."},{"id":"ts-slide-unknown","title":"Prefer unknown to any","body":"any turns checking off. unknown keeps checking on until you narrow.\n\nfunction read(value: unknown): string {\n  if (typeof value === \"string\") return value;\n  return \"Not text\";\n}\n\nYou cannot call string methods on value until a check proves it is a string. That extra step is what keeps the type system honest when data arrives from outside your file."}]},{"id":"ts-lesson-type-error","type":"video","title":"Read a type error","url":"motion.mp4","captions":"motion.vtt","description":"A silent six-second loop plays while the captions state a type error. The transcript below is the full walkthrough, so you can learn it without the picture or the sound.","transcript":"Picture a file that fails to compile with this message: Type 'string' is not assignable to type 'number'.\n\nRead it from the value that was given to the value that was required. A string was provided where a number belongs. The compiler is not rejecting JavaScript. It is saying the annotation and the value disagree.\n\nFind the annotation first. If a parameter is minutes: number, every caller must pass a number. Then find the argument. A quoted label such as \"8\" is a string, even when it looks numeric. Pass 8, or change the parameter to string if text is what you really accept.\n\nDo not silence the message by annotating the value as any. any would hide this call and every later mistake on that value. If you do not know the type yet, use unknown and narrow it with typeof before you treat it as text or as a number.\n\nWhen the message is long, start at the last line. That line usually names the mismatch. The lines above it show where the value traveled to get there."},{"id":"ts-quiz-narrow","type":"quiz","title":"Practice narrowing","questions":[{"id":"ts-q-typeof","prompt":"id has type string | number. Which check lets you treat id as a string inside the branch?","options":["if (typeof id === \"string\")","if (id = \"string\")","if (id == null)"],"answer":0,"explanation":"typeof id === \"string\" is a type guard. Inside that branch TypeScript narrows id to string, so string methods such as toUpperCase are allowed. A single equals sign assigns; it does not check."},{"id":"ts-q-literal","prompt":"type Status = \"draft\" | \"published\". Which assignment is allowed?","options":["let status: Status = \"archived\"","let status: Status = \"published\"","let status: Status = false"],"answer":1,"explanation":"Only the two listed literals are allowed. \"archived\" is a string, but it is not one of those states. false is a boolean, so it is outside the union too."},{"id":"ts-q-unknown","prompt":"Why prefer unknown over any for a value you have not checked yet?","options":["unknown skips every check, which is faster","unknown still requires a check before you use the value","unknown only allows numbers"],"answer":1,"explanation":"any disables type checking for later uses. unknown refuses to be treated as a specific type until you narrow it, so a mistake stays visible instead of becoming a runtime error."}]}]}]},{"id":"ts-sec-patterns","type":"section","title":"03 · Patterns that scale","children":[{"id":"ts-lesson-shapes","type":"slides","title":"Name shapes and keep them flexible","slides":[{"id":"ts-slide-alias","title":"Give a shape a name","body":"A type alias lets you reuse a shape instead of rewriting it.\n\ntype Lesson = {\n  title: string;\n  minutes: number;\n};\n\nfunction summary(lesson: Lesson): string {\n  return lesson.title + \" · \" + lesson.minutes + \" min\";\n}\n\nUse an alias when the same shape appears in parameters, return values, or other types."},{"id":"ts-slide-and","title":"Combine shapes with &","body":"An intersection requires every member of both types.\n\ntype Identified = Lesson & { id: string };\n\nA value of type Identified must have title, minutes, and id. The & does not mean \"and also maybe.\" It means the value satisfies both shapes at once.\n\nUse | when a value is one shape or the other. Use & when it must be both."},{"id":"ts-slide-generic","title":"Generics remember the caller's type","body":"A generic is a placeholder. The caller decides what it stands for.\n\nfunction first<T>(items: T[]): T | undefined {\n  return items[0];\n}\n\nfirst([\"types\", \"unions\"]) has type string | undefined. first([1, 2]) has type number | undefined. One function serves both lists, and the element type is not forgotten. The undefined is there because an empty list has no first item."},{"id":"ts-slide-any","title":"Keep any small","body":"any is an escape hatch. It accepts every value, then stops checking whatever you do next.\n\nconst value: any = \"hello\";\nvalue.notAMethod();\n\nThat call is not reported, and it throws when the program runs. Prefer a real type, a union, or unknown plus a check. If you truly cannot describe a boundary yet, keep any on the smallest possible value and replace it when you can."}]},{"id":"ts-quiz-shapes","type":"quiz","title":"Choose the right tool","questions":[{"id":"ts-q-alias","prompt":"What does a type alias such as type Lesson = { title: string } do?","options":["It runs a function when the file loads","It gives a type a name you can reuse","It turns checking off for the file"],"answer":1,"explanation":"The alias names that object shape. You can write Lesson anywhere you would have written the shape inline, which keeps signatures shorter and consistent."},{"id":"ts-q-and","prompt":"A value is typed Lesson & { id: string }. What must it have?","options":["Either the Lesson fields or an id, but not both","title, minutes, and id","Only an id"],"answer":1,"explanation":"& means intersection. The value has to satisfy Lesson and the extra id field. A union with | would have meant one shape or the other."},{"id":"ts-q-generic","prompt":"What does first<T>(items: T[]): T | undefined preserve?","options":["It always returns a string","The element type of the list you passed, or undefined","It erases the element type and returns any"],"answer":1,"explanation":"T stands for the element type. Pass a string array and the result is string | undefined. Pass a number array and the result is number | undefined. undefined covers an empty list."},{"id":"ts-q-any","prompt":"What is the risk of annotating a value as any?","options":["TypeScript checks it more strictly than unknown","Later mistakes on that value are not reported","It can only hold numbers"],"answer":1,"explanation":"any turns checking off. A misspelled method or a wrong argument can pass the compiler and fail when the program runs. unknown plus a narrowing check keeps that protection."}]}]}],"finalQuiz":{"id":"ts-final","type":"quiz","title":"Final quiz","questions":[{"id":"ts-fq-what","prompt":"What does TypeScript add to JavaScript?","options":["A new browser runtime","A type system that checks code before it runs","A replacement for HTML"],"answer":1,"explanation":"TypeScript checks types as you edit and compile. The program that runs is still JavaScript."},{"id":"ts-fq-array","prompt":"Which type matches a list of numbers?","options":["string","number[]","\"draft\" | \"published\""],"answer":1,"explanation":"number[] is an array of numbers. Array<number> means the same thing. string is one piece of text, and the literal union is two exact strings."},{"id":"ts-fq-narrow","prompt":"A parameter has type string | number, and you want to call toUpperCase. What should you do first?","options":["Call toUpperCase immediately","Narrow with typeof value === \"string\"","Annotate the parameter as any"],"answer":1,"explanation":"toUpperCase exists on string, not on the whole union. A typeof check narrows the value so the call is safe. any would hide a wrong call instead of making it safe."},{"id":"ts-fq-generic","prompt":"first<T>(items: T[]): T | undefined is called with [true, false]. What is the result type?","options":["string","boolean | undefined","number"],"answer":1,"explanation":"T becomes boolean because the array elements are booleans. The return type is T | undefined, so the result is boolean | undefined. The undefined remains because the list could be empty."},{"id":"ts-fq-literal","prompt":"status has type \"draft\" | \"published\". Which value is allowed?","options":["\"published\"","\"done\"","1"],"answer":0,"explanation":"Only the listed literals are allowed. \"done\" is text, but it is not one of those two states. 1 is a number."}]},"settings":{"passScore":80,"allowRetakes":true,"sequential":true,"requireLessons":true,"brand":"#3178c6","background":"#0c0e12","surface":"#14171d","text":"#edf0f7","muted":"#a6afc0","border":"#343b49","fontScale":1,"spacing":24,"contentWidth":1000,"radius":8,"font":"humanist","headingFont":"system","lineHeight":1.7}}</script></body></html>
