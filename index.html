<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TypeScript skills course</title><link rel="stylesheet" href="lms.css"><script src="lms-runtime.js" defer></script></head><body class="lms-export-body"><div id="lms-root"></div><script id="lms-course-data" type="application/json">{"schemaVersion":1,"id":"ts-skills-complete-v1","title":"TypeScript skills","description":"A skills-based path through TypeScript foundations, advanced types, runtime boundaries, tooling and library integration. MDN provides JavaScript foundations; the official TypeScript documentation supplies TypeScript-specific material. Original examples and self-assessed exercises accompany each lesson.","sections":[{"id":"ts-sec-orientation","type":"section","title":"01 · Start and understand the runtime","children":[{"id":"ts-lesson-pipeline","type":"slides","title":"Type checking versus execution","minutes":15,"objectives":["Describe the path from TypeScript source to running JavaScript."],"sources":[{"title":"TypeScript: The Basics","url":"https://www.typescriptlang.org/docs/handbook/2/basic-types.html"},{"title":"TypeScript tooling","url":"https://www.typescriptlang.org/docs/handbook/typescript-tooling-in-5-minutes.html"},{"title":"MDN: Introduction","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Introduction"}],"slides":[{"id":"ts-lesson-pipeline-concept","title":"Type checking versus execution","body":"YOUR GOAL\nDescribe the path from TypeScript source to running JavaScript.\n\nTypeScript checks whether your code uses values consistently. JavaScript still controls runtime behavior. Most type syntax is erased. An annotation cannot validate a server response or turn text into a number. Some features, such as enums, do emit JavaScript."},{"id":"ts-lesson-pipeline-example","title":"Read the code","body":"```ts\nconst minutes: number = 12;\nconsole.log(minutes + 1);\n// JavaScript output has no : number annotation.\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-pipeline-practice","title":"Try it yourself","body":"Create a variable minutes with a number annotation. Assign text on purpose and inspect the error. Then convert the text with Number() and inspect the emitted JavaScript.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-pipeline-solution","title":"Compare your solution","body":"```ts\nconst input = \"12\";\nconst minutes: number = Number(input);\nif (!Number.isFinite(minutes)) throw new Error(\"Invalid minutes\");\nconsole.log(minutes + 1);\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-pipeline-takeaway","title":"Keep this in mind","body":"A compiler check and a runtime validation solve different problems. Passing the compiler does not prove your program is correct.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-setup","type":"slides","title":"Create a strict practice project","minutes":15,"objectives":["Run the compiler with a reproducible project configuration."],"sources":[{"title":"TypeScript: The Basics","url":"https://www.typescriptlang.org/docs/handbook/2/basic-types.html"},{"title":"TypeScript tooling","url":"https://www.typescriptlang.org/docs/handbook/typescript-tooling-in-5-minutes.html"},{"title":"MDN: Introduction","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Introduction"}],"slides":[{"id":"ts-lesson-setup-concept","title":"Create a strict practice project","body":"YOUR GOAL\nRun the compiler with a reproducible project configuration.\n\nInstall TypeScript as a project development dependency and use its local compiler. A tsconfig.json defines the project. strict enables a family of checks. noEmit checks without writing JavaScript; an emitter or bundler is a separate choice. Pin and record your compiler version when comparing results."},{"id":"ts-lesson-setup-example","title":"Read the code","body":"```text\nnpm init -y\nnpm install --save-dev typescript\nnpx tsc --init\nnpx tsc --noEmit\nnpx tsc --version\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-setup-practice","title":"Try it yourself","body":"Create src/practice.ts. Enable strict, noEmit and an appropriate target in tsconfig.json. Run npx tsc -p tsconfig.json, then inspect the resolved config with --showConfig.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-setup-solution","title":"Compare your solution","body":"```text\n{\n  \"compilerOptions\": {\n    \"target\": \"ES2022\",\n    \"strict\": true,\n    \"noEmit\": true\n  },\n  \"include\": [\"src/**/*.ts\"]\n}\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-setup-takeaway","title":"Keep this in mind","body":"Commands belong in a terminal, not a .ts file. Passing explicit filenames to tsc bypasses the project config; use -p for project checks. Course snippets generally assume strict checking and ES2022 with DOM declarations.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-orientation-quiz","type":"quiz","title":"Skill check · Start and understand the runtime","skill":"Start and understand the runtime","questions":[{"id":"ts-sec-orientation-quiz-q1","prompt":"Does const value = payload as Lesson validate an API response?","options":["Yes; it checks every field","Yes; it converts JSON into a class","No; assertions are erased"],"answer":2,"explanation":"An assertion changes the checker’s view. Validate untrusted data with runtime checks."},{"id":"ts-sec-orientation-quiz-q2","prompt":"Which command explicitly checks the project config?","options":["node practice.ts always checks all types","npx tsc -p tsconfig.json --noEmit","npx tsc practice.ts always loads tsconfig.json"],"answer":1,"explanation":"-p selects a config. Explicit input filenames do not load its compiler options."},{"id":"ts-sec-orientation-quiz-q3","prompt":"What does strict primarily provide?","options":["A family of stronger static checks","Automatic runtime input validation","A proof that there are no bugs"],"answer":0,"explanation":"Strictness catches additional type mistakes, but cannot replace testing or input validation."}],"sources":[{"title":"TypeScript: The Basics","url":"https://www.typescriptlang.org/docs/handbook/2/basic-types.html"},{"title":"TypeScript tooling","url":"https://www.typescriptlang.org/docs/handbook/typescript-tooling-in-5-minutes.html"},{"title":"MDN: Introduction","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Introduction"}]}],"sources":[{"title":"TypeScript: The Basics","url":"https://www.typescriptlang.org/docs/handbook/2/basic-types.html"},{"title":"TypeScript tooling","url":"https://www.typescriptlang.org/docs/handbook/typescript-tooling-in-5-minutes.html"},{"title":"MDN: Introduction","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Introduction"}],"studyGuide":{"title":"01 · Start and understand the runtime · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["A compiler check and a runtime validation solve different problems. Passing the compiler does not prove your program is correct.","Commands belong in a terminal, not a .ts file. Passing explicit filenames to tsc bypasses the project config; use -p for project checks. Course snippets generally assume strict checking and ES2022 with DOM declarations."]}},{"id":"ts-sec-javascript","type":"section","title":"02 · JavaScript foundations for TypeScript","children":[{"id":"ts-lesson-scope","type":"slides","title":"Scope, const, and closures","minutes":15,"objectives":["Predict which values a function can access."],"sources":[{"title":"MDN: Grammar and types","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Grammar_and_types"},{"title":"MDN: Functions","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Functions"},{"title":"MDN: Closures","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures"},{"title":"TypeScript: Variable declarations","url":"https://www.typescriptlang.org/docs/handbook/variable-declarations.html"}],"slides":[{"id":"ts-lesson-scope-concept","title":"Scope, const, and closures","body":"YOUR GOAL\nPredict which values a function can access.\n\nlet and const are block-scoped. const prevents rebinding; it does not freeze an object. A closure retains access to its lexical environment. TypeScript does not change these JavaScript rules. Prefer explicit inputs over hidden mutable state when practical."},{"id":"ts-lesson-scope-example","title":"Read the code","body":"```ts\nfunction makeCounter() {\n  let count = 0;\n  return () => ++count;\n}\nconst next = makeCounter();\nconsole.log(next(), next()); // 1, 2\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-scope-practice","title":"Try it yourself","body":"Create two counters. Predict whether they share a count. Then create a const object and update one property. Explain why that is allowed.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-scope-solution","title":"Compare your solution","body":"```ts\nfunction makeCounter() {\n  let count = 0;\n  return () => ++count;\n}\nconst a = makeCounter();\nconst b = makeCounter();\nconsole.log(a(), a(), b()); // 1, 2, 1\nconst course = { title: \"TypeScript\" };\ncourse.title = \"TypeScript skills\";\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-scope-takeaway","title":"Keep this in mind","body":"Each invocation creates its own lexical environment. const, readonly, and Object.freeze address different kinds of change.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-coercion","type":"slides","title":"Equality, optional chaining, and defaults","minutes":15,"objectives":["Preserve legitimate zero and empty-string values."],"sources":[{"title":"MDN: Grammar and types","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Grammar_and_types"},{"title":"MDN: Functions","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Functions"},{"title":"MDN: Closures","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures"},{"title":"TypeScript: Variable declarations","url":"https://www.typescriptlang.org/docs/handbook/variable-declarations.html"}],"slides":[{"id":"ts-lesson-coercion-concept","title":"Equality, optional chaining, and defaults","body":"YOUR GOAL\nPreserve legitimate zero and empty-string values.\n\nStrict equality avoids implicit coercion. Optional chaining stops a property access when the receiver is null or undefined. Nullish coalescing uses a default only for null or undefined. Logical OR also replaces false, zero and empty text."},{"id":"ts-lesson-coercion-example","title":"Read the code","body":"```ts\nconst zero = 0;\nconsole.log(zero || 10); // 10\nconsole.log(zero ?? 10); // 0\nconst user: { name?: string } = {};\nconsole.log(user.name?.toUpperCase() ?? \"Guest\");\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-coercion-practice","title":"Try it yourself","body":"Write a label function accepting { title?: string; minutes?: number }. Default absent minutes to 10 but preserve 0. Default absent title to Untitled but preserve empty text.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-coercion-solution","title":"Compare your solution","body":"```ts\nfunction label(value: { title?: string; minutes?: number }) {\n  const title = value.title ?? \"Untitled\";\n  const minutes = value.minutes ?? 10;\n  return `${title}: ${minutes} min`;\n}\nconsole.log(label({ title: \"\", minutes: 0 }));\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-coercion-takeaway","title":"Keep this in mind","body":"Optional chaining does not validate an arbitrary value. A truthiness check can accidentally discard meaningful empty strings or zero.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-javascript-quiz","type":"quiz","title":"Skill check · JavaScript foundations for TypeScript","skill":"JavaScript foundations for TypeScript","questions":[{"id":"ts-sec-javascript-quiz-q1","prompt":"What does const prevent for an object binding?","options":["All changes through aliases","Reassigning the binding","Every mutation inside the object"],"answer":1,"explanation":"const protects the variable binding. Object properties may still change."},{"id":"ts-sec-javascript-quiz-q2","prompt":"What is 0 ?? 20?","options":["0","20","undefined"],"answer":0,"explanation":"?? uses the fallback only for null or undefined."},{"id":"ts-sec-javascript-quiz-q3","prompt":"Do two separate calls to makeCounter share the local count?","options":["Always","Only when strict is enabled","No, each call creates its own environment"],"answer":2,"explanation":"Closure behavior comes from JavaScript lexical environments, independent of type checking."}],"sources":[{"title":"MDN: Grammar and types","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Grammar_and_types"},{"title":"MDN: Functions","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Functions"},{"title":"MDN: Closures","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures"},{"title":"TypeScript: Variable declarations","url":"https://www.typescriptlang.org/docs/handbook/variable-declarations.html"}]}],"sources":[{"title":"MDN: Grammar and types","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Grammar_and_types"},{"title":"MDN: Functions","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Functions"},{"title":"MDN: Closures","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures"},{"title":"TypeScript: Variable declarations","url":"https://www.typescriptlang.org/docs/handbook/variable-declarations.html"}],"studyGuide":{"title":"02 · JavaScript foundations for TypeScript · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["Each invocation creates its own lexical environment. const, readonly, and Object.freeze address different kinds of change.","Optional chaining does not validate an arbitrary value. A truthiness check can accidentally discard meaningful empty strings or zero."]}},{"id":"ts-sec-everyday","type":"section","title":"03 · Everyday types and inference","children":[{"id":"ts-lesson-primitives","type":"slides","title":"Annotate boundaries and trust inference","minutes":15,"objectives":["Use primitive and collection types without unnecessary annotations."],"sources":[{"title":"Everyday Types","url":"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html"},{"title":"Type Inference","url":"https://www.typescriptlang.org/docs/handbook/type-inference.html"}],"slides":[{"id":"ts-lesson-primitives-concept","title":"Annotate boundaries and trust inference","body":"YOUR GOAL\nUse primitive and collection types without unnecessary annotations.\n\nUse lowercase string, number and boolean for primitive values. TypeScript infers many local types from initializers. Annotate public function boundaries and ambiguous empty collections. A numeric-looking string is still text; number includes non-integer values and NaN."},{"id":"ts-lesson-primitives-example","title":"Read the code","body":"```ts\nlet title = \"Arrays\"; // string\nconst published: boolean = true;\nconst minutes: number[] = [10, 12];\nfunction total(items: number[]): number {\n  return items.reduce((sum, value) => sum + value, 0);\n}\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-primitives-practice","title":"Try it yourself","body":"Write average(items: number[]): number | undefined. Return undefined for an empty array. Do not use any or the boxed Number type.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-primitives-solution","title":"Compare your solution","body":"```ts\nfunction average(items: number[]): number | undefined {\n  if (items.length === 0) return undefined;\n  return items.reduce((sum, n) => sum + n, 0) / items.length;\n}\nconsole.log(average([10, 20]));\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-primitives-takeaway","title":"Keep this in mind","body":"An annotation describes allowed values; it does not coerce them. Hover inferred values before adding redundant annotations.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-literals","type":"slides","title":"Literal unions, as const, and satisfies","minutes":15,"objectives":["Check a configuration while retaining useful inference."],"sources":[{"title":"Everyday Types","url":"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html"},{"title":"Type Inference","url":"https://www.typescriptlang.org/docs/handbook/type-inference.html"}],"slides":[{"id":"ts-lesson-literals-concept","title":"Literal unions, as const, and satisfies","body":"YOUR GOAL\nCheck a configuration while retaining useful inference.\n\nLiteral types describe exact values. let often widens a literal to its broader primitive type. as const preserves literal information and gives object properties and arrays readonly types. satisfies checks compatibility while retaining the expression’s resulting type; contextual typing can still influence inference."},{"id":"ts-lesson-literals-example","title":"Read the code","body":"```ts\ntype Mode = \"read\" | \"practice\";\nconst config = {\n  mode: \"read\",\n  minutes: 10\n} satisfies { mode: Mode; minutes: number };\nconst steps = [\"read\", \"practice\"] as const;\ntype Step = typeof steps[number];\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-literals-practice","title":"Try it yourself","body":"Define ThemeName as light | dark. Create an object containing those keys with string values using satisfies Record\u003cThemeName, string>. Call a string method on the dark value.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-literals-solution","title":"Compare your solution","body":"```ts\ntype ThemeName = \"light\" | \"dark\";\nconst themes = { light: \"#ffffff\", dark: \"#111111\" } satisfies Record\u003cThemeName, string>;\nconsole.log(themes.dark.toUpperCase());\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-literals-takeaway","title":"Keep this in mind","body":"as const does not freeze values at runtime. satisfies is a compatibility check, not a general runtime validator or a cast.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-everyday-quiz","type":"quiz","title":"Skill check · Everyday types and inference","skill":"Everyday types and inference","questions":[{"id":"ts-sec-everyday-quiz-q1","prompt":"Which type should normally describe primitive text?","options":["string","String","any"],"answer":0,"explanation":"Lowercase string describes primitive text. String is a boxed-object type."},{"id":"ts-sec-everyday-quiz-q2","prompt":"What is the purpose of satisfies?","options":["Validate a server response at runtime","Always convert a value into the target type","Check compatibility while retaining the expression’s resulting type"],"answer":2,"explanation":"satisfies provides a static compatibility check; it emits no runtime validation."},{"id":"ts-sec-everyday-quiz-q3","prompt":"What does as const guarantee at runtime?","options":["A validation exception on mutation","No runtime freezing","Deep freezing"],"answer":1,"explanation":"Const assertions only influence types. Runtime immutability needs separate behavior."}],"sources":[{"title":"Everyday Types","url":"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html"},{"title":"Type Inference","url":"https://www.typescriptlang.org/docs/handbook/type-inference.html"}]}],"sources":[{"title":"Everyday Types","url":"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html"},{"title":"Type Inference","url":"https://www.typescriptlang.org/docs/handbook/type-inference.html"}],"studyGuide":{"title":"03 · Everyday types and inference · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["An annotation describes allowed values; it does not coerce them. Hover inferred values before adding redundant annotations.","as const does not freeze values at runtime. satisfies is a compatibility check, not a general runtime validator or a cast."]}},{"id":"ts-sec-objects","type":"section","title":"04 · Model objects and collections","children":[{"id":"ts-lesson-shapes","type":"slides","title":"Interfaces, aliases, and optional properties","minutes":15,"objectives":["Choose a reusable object shape and handle missing fields."],"sources":[{"title":"Object Types","url":"https://www.typescriptlang.org/docs/handbook/2/objects.html"},{"title":"Aliases and interfaces","url":"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html"},{"title":"MDN: Objects","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Working_with_objects"},{"title":"MDN: Keyed collections","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Keyed_collections"}],"slides":[{"id":"ts-lesson-shapes-concept","title":"Interfaces, aliases, and optional properties","body":"YOUR GOAL\nChoose a reusable object shape and handle missing fields.\n\nAn interface names an object contract and can be extended or merged. A type alias can also name unions, tuples and other expressions. TypeScript normally checks structure rather than where a value was declared. Optional properties may be absent; reading one usually includes undefined under strictNullChecks."},{"id":"ts-lesson-shapes-example","title":"Read the code","body":"```ts\ninterface Lesson {\n  readonly id: string;\n  title: string;\n  minutes?: number;\n}\ntype PublishedLesson = Lesson & { published: true };\nfunction duration(lesson: Lesson) {\n  return lesson.minutes ?? 0;\n}\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-shapes-practice","title":"Try it yourself","body":"Create a Lesson with optional summary. Write describe() that returns uppercase summary or No summary. Add an interface VideoLesson extending Lesson with url.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-shapes-solution","title":"Compare your solution","body":"```ts\ninterface Lesson { id: string; summary?: string }\ninterface VideoLesson extends Lesson { url: string }\nfunction describe(lesson: Lesson): string {\n  return lesson.summary?.toUpperCase() ?? \"No summary\";\n}\nconst video: VideoLesson = { id: \"intro\", url: \"intro.mp4\" };\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-shapes-takeaway","title":"Keep this in mind","body":"Fresh object literals receive excess-property checks. Do not bypass a misspelled property with an assertion. readonly is shallow and does not prevent mutation through other references.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-collections","type":"slides","title":"Arrays, tuples, records, maps, and sets","minutes":15,"objectives":["Choose a collection by its actual data model."],"sources":[{"title":"Object Types","url":"https://www.typescriptlang.org/docs/handbook/2/objects.html"},{"title":"Aliases and interfaces","url":"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html"},{"title":"MDN: Objects","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Working_with_objects"},{"title":"MDN: Keyed collections","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Keyed_collections"}],"slides":[{"id":"ts-lesson-collections-concept","title":"Arrays, tuples, records, maps, and sets","body":"YOUR GOAL\nChoose a collection by its actual data model.\n\nArrays describe variable-length sequences. Tuples describe known positions and lengths. Record maps a key type to a value type; arbitrary string keys can still be missing at runtime. Map supports keys beyond strings; Set stores unique values. readonly arrays prevent mutation through that reference."},{"id":"ts-lesson-collections-example","title":"Read the code","body":"```ts\ntype Coordinate = readonly [x: number, y: number];\nconst point: Coordinate = [10, 20];\nconst scores: Record\u003c\"read\" | \"practice\", number> = { read: 80, practice: 90 };\nconst names = new Map\u003cstring, string>([[\"a\", \"Arrays\"]]);\nconst completed = new Set\u003cstring>([\"a\", \"a\"]);\nconsole.log(names.get(\"missing\")); // undefined\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-collections-practice","title":"Try it yourself","body":"Write totalMinutes accepting readonly number[]. Create a Map from lesson IDs to minutes and handle a missing entry. Explain why Record\u003cstring, number> alone does not prove any key exists.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-collections-solution","title":"Compare your solution","body":"```ts\nfunction totalMinutes(values: readonly number[]): number {\n  return values.reduce((sum, n) => sum + n, 0);\n}\nconst minutes = new Map\u003cstring, number>([[\"intro\", 10]]);\nconst missing = minutes.get(\"advanced\") ?? 0;\nconsole.log(totalMinutes([missing, 10]));\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-collections-takeaway","title":"Keep this in mind","body":"A tuple is a type-level shape; it is still an array at runtime. noUncheckedIndexedAccess adds missing-value checks for unchecked indexing.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-objects-quiz","type":"quiz","title":"Skill check · Model objects and collections","skill":"Model objects and collections","questions":[{"id":"ts-sec-objects-quiz-q1","prompt":"Reading summary?: string with strictNullChecks gives which type?","options":["Always string","Always null","string | undefined"],"answer":2,"explanation":"An optional property might be missing, so reading it can produce undefined."},{"id":"ts-sec-objects-quiz-q2","prompt":"Does readonly on a property deeply freeze its object?","options":["Only in production builds","No; it restricts assignment through that type","Yes, recursively"],"answer":1,"explanation":"readonly is a static and shallow restriction, not a runtime freeze."},{"id":"ts-sec-objects-quiz-q3","prompt":"What does Map.get return for an absent key?","options":["undefined","A default value of the declared value type","Always an exception"],"answer":0,"explanation":"The return type includes undefined because a key may be absent."}],"sources":[{"title":"Object Types","url":"https://www.typescriptlang.org/docs/handbook/2/objects.html"},{"title":"Aliases and interfaces","url":"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html"},{"title":"MDN: Objects","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Working_with_objects"},{"title":"MDN: Keyed collections","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Keyed_collections"}]}],"sources":[{"title":"Object Types","url":"https://www.typescriptlang.org/docs/handbook/2/objects.html"},{"title":"Aliases and interfaces","url":"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html"},{"title":"MDN: Objects","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Working_with_objects"},{"title":"MDN: Keyed collections","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Keyed_collections"}],"studyGuide":{"title":"04 · Model objects and collections · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["Fresh object literals receive excess-property checks. Do not bypass a misspelled property with an assertion. readonly is shallow and does not prevent mutation through other references.","A tuple is a type-level shape; it is still an array at runtime. noUncheckedIndexedAccess adds missing-value checks for unchecked indexing."]}},{"id":"ts-sec-narrowing","type":"section","title":"05 · Narrow uncertain values safely","children":[{"id":"ts-lesson-guards","type":"slides","title":"Union types and control-flow analysis","minutes":15,"objectives":["Use runtime evidence to narrow a union."],"sources":[{"title":"Narrowing","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html"},{"title":"MDN: Control flow","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Control_flow_and_error_handling"}],"slides":[{"id":"ts-lesson-guards-concept","title":"Union types and control-flow analysis","body":"YOUR GOAL\nUse runtime evidence to narrow a union.\n\nA union means a value can be any listed member. Before using a member-specific operation, establish which member you have. typeof, equality, in, instanceof, assignments and early returns can all narrow. typeof null is object, so object checks also need a null check."},{"id":"ts-lesson-guards-example","title":"Read the code","body":"```ts\nfunction label(value: string | number | null): string {\n  if (value === null) return \"Missing\";\n  if (typeof value === \"string\") return value.toUpperCase();\n  return value.toFixed(0);\n}\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-guards-practice","title":"Try it yourself","body":"Write normalize(value: string | string[] | null): string[]. Use a null check and Array.isArray. Preserve an empty string instead of treating it as missing.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-guards-solution","title":"Compare your solution","body":"```ts\nfunction normalize(value: string | string[] | null): string[] {\n  if (value === null) return [];\n  if (Array.isArray(value)) return value;\n  return [value];\n}\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-guards-takeaway","title":"Keep this in mind","body":"typeof returns limited JavaScript categories. Truthiness is useful only when dropping every falsy value is intentional.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-predicates","type":"slides","title":"unknown, predicates, and assertion functions","minutes":15,"objectives":["Check external input before treating it as domain data."],"sources":[{"title":"Narrowing","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html"},{"title":"MDN: Control flow","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Control_flow_and_error_handling"}],"slides":[{"id":"ts-lesson-predicates-concept","title":"unknown, predicates, and assertion functions","body":"YOUR GOAL\nCheck external input before treating it as domain data.\n\nunknown accepts any incoming value but requires evidence before use. A predicate returns value is Type. An assertion function returns asserts value is Type and throws when its condition fails. The compiler trusts declared predicates: your implementation must actually check the contract."},{"id":"ts-lesson-predicates-example","title":"Read the code","body":"```ts\ntype Lesson = { id: string; minutes: number };\nfunction isLesson(value: unknown): value is Lesson {\n  return typeof value === \"object\" && value !== null\n    && \"id\" in value && typeof value.id === \"string\"\n    && \"minutes\" in value && typeof value.minutes === \"number\"\n    && Number.isFinite(value.minutes);\n}\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-predicates-practice","title":"Try it yourself","body":"Write assertText(value: unknown): asserts value is string. Throw an Error for non-text input. Use it before calling toUpperCase. Then explain what a dishonest predicate could break.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-predicates-solution","title":"Compare your solution","body":"```ts\nfunction assertText(value: unknown): asserts value is string {\n  if (typeof value !== \"string\") throw new Error(\"Expected text\");\n}\nconst input: unknown = \"TypeScript\";\nassertText(input);\nconsole.log(input.toUpperCase());\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-predicates-takeaway","title":"Keep this in mind","body":"any allows unchecked operations; unknown requires narrowing. A predicate validates only what its body checks, not every business rule automatically.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-narrowing-quiz","type":"quiz","title":"Skill check · Narrow uncertain values safely","skill":"Narrow uncertain values safely","questions":[{"id":"ts-sec-narrowing-quiz-q1","prompt":"Why use unknown at an untrusted boundary?","options":["It disables checks like any","It requires narrowing before specific operations","It validates JSON automatically"],"answer":1,"explanation":"unknown keeps later uses checked until evidence establishes a usable type."},{"id":"ts-sec-narrowing-quiz-q2","prompt":"Why is typeof value === \"object\" insufficient to reject null?","options":["typeof null is \"object\"","null is always an array","TypeScript rewrites typeof"],"answer":0,"explanation":"JavaScript’s typeof null result requires an explicit null check."},{"id":"ts-sec-narrowing-quiz-q3","prompt":"Can a declared type predicate lie?","options":["No, the compiler proves every property check","Only with strict disabled","Yes; its runtime implementation still needs correct checks"],"answer":2,"explanation":"The compiler trusts the predicate signature. Test validators with malformed values."}],"sources":[{"title":"Narrowing","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html"},{"title":"MDN: Control flow","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Control_flow_and_error_handling"}]}],"sources":[{"title":"Narrowing","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html"},{"title":"MDN: Control flow","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Control_flow_and_error_handling"}],"studyGuide":{"title":"05 · Narrow uncertain values safely · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["typeof returns limited JavaScript categories. Truthiness is useful only when dropping every falsy value is intentional.","any allows unchecked operations; unknown requires narrowing. A predicate validates only what its body checks, not every business rule automatically."]}},{"id":"ts-sec-states","type":"section","title":"06 · Represent states and handle every case","children":[{"id":"ts-lesson-discriminants","type":"slides","title":"Discriminated unions","minutes":15,"objectives":["Make invalid combinations harder to represent."],"sources":[{"title":"Discriminated unions","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html#discriminated-unions"},{"title":"Exhaustiveness","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html#exhaustiveness-checking"}],"slides":[{"id":"ts-lesson-discriminants-concept","title":"Discriminated unions","body":"YOUR GOAL\nMake invalid combinations harder to represent.\n\nUse a shared literal field to identify each state. A loaded state can require data while an error state requires a message. This is stronger than one object with several unrelated optional fields. Checking the discriminant narrows the associated fields."},{"id":"ts-lesson-discriminants-example","title":"Read the code","body":"```ts\ntype LoadState =\n  | { status: \"loading\" }\n  | { status: \"loaded\"; title: string }\n  | { status: \"error\"; message: string };\nfunction text(state: LoadState) {\n  if (state.status === \"loaded\") return state.title;\n  if (state.status === \"error\") return state.message;\n  return \"Loading\";\n}\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-discriminants-practice","title":"Try it yourself","body":"Model a payment as pending, paid with receiptId, or failed with reason. Write a label function. Try to construct a paid state without a receipt ID and inspect the error.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-discriminants-solution","title":"Compare your solution","body":"```ts\ntype Payment =\n  | { kind: \"pending\" }\n  | { kind: \"paid\"; receiptId: string }\n  | { kind: \"failed\"; reason: string };\nfunction label(payment: Payment): string {\n  switch (payment.kind) {\n    case \"pending\": return \"Pending\";\n    case \"paid\": return payment.receiptId;\n    case \"failed\": return payment.reason;\n  }\n}\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-discriminants-takeaway","title":"Keep this in mind","body":"Domain modeling catches impossible field combinations before UI code. Choose a discriminant that describes the state, not incidental implementation details.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-exhaustive","type":"slides","title":"never and exhaustive switches","minutes":15,"objectives":["Make a newly added union member trigger a useful compiler error."],"sources":[{"title":"Discriminated unions","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html#discriminated-unions"},{"title":"Exhaustiveness","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html#exhaustiveness-checking"}],"slides":[{"id":"ts-lesson-exhaustive-concept","title":"never and exhaustive switches","body":"YOUR GOAL\nMake a newly added union member trigger a useful compiler error.\n\nnever represents no possible value. After every union member is handled, the remaining value can be assigned to never. If you later add a member, that assignment fails until you handle it. This is a maintenance tool, not an automatic runtime proof for unvalidated input."},{"id":"ts-lesson-exhaustive-example","title":"Read the code","body":"```ts\nfunction assertNever(value: never): never {\n  throw new Error(`Unexpected state: ${String(value)}`);\n}\ntype Action = { kind: \"start\" } | { kind: \"stop\" };\nfunction label(action: Action): string {\n  switch (action.kind) {\n    case \"start\": return \"Started\";\n    case \"stop\": return \"Stopped\";\n    default: return assertNever(action);\n  }\n}\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-exhaustive-practice","title":"Try it yourself","body":"Add a pause action. Observe the assertNever error, then add the missing case. Explain how never differs from void.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-exhaustive-solution","title":"Compare your solution","body":"```ts\ntype Action = { kind: \"start\" } | { kind: \"stop\" } | { kind: \"pause\" };\nfunction assertNever(value: never): never { throw new Error(String(value)); }\nfunction label(action: Action): string {\n  switch (action.kind) {\n    case \"start\": return \"Started\";\n    case \"stop\": return \"Stopped\";\n    case \"pause\": return \"Paused\";\n    default: return assertNever(action);\n  }\n}\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-exhaustive-takeaway","title":"Keep this in mind","body":"void describes an ignored or absent useful return result. never describes a function that cannot return normally, or a value that cannot exist.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-states-quiz","type":"quiz","title":"Skill check · Represent states and handle every case","skill":"Represent states and handle every case","questions":[{"id":"ts-sec-states-quiz-q1","prompt":"Which model best ties loaded data to its state?","options":["A discriminated union requiring data on loaded","An object with all fields optional","A string and an unrelated global data variable"],"answer":0,"explanation":"A discriminated union makes the relationship explicit and supports narrowing."},{"id":"ts-sec-states-quiz-q2","prompt":"What does assigning the remaining switch value to never check?","options":["The API is always online","All values were validated at runtime","All union members have been handled"],"answer":2,"explanation":"An unhandled member remains assignable to its own type, not never, producing an error."},{"id":"ts-sec-states-quiz-q3","prompt":"Which return type describes a function that always throws?","options":["string","never","unknown"],"answer":1,"explanation":"It cannot return normally, so never expresses its return behavior."}],"sources":[{"title":"Discriminated unions","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html#discriminated-unions"},{"title":"Exhaustiveness","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html#exhaustiveness-checking"}]}],"sources":[{"title":"Discriminated unions","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html#discriminated-unions"},{"title":"Exhaustiveness","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html#exhaustiveness-checking"}],"studyGuide":{"title":"06 · Represent states and handle every case · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["Domain modeling catches impossible field combinations before UI code. Choose a discriminant that describes the state, not incidental implementation details.","void describes an ignored or absent useful return result. never describes a function that cannot return normally, or a value that cannot exist."]}},{"id":"ts-sec-functions","type":"section","title":"07 · Design function contracts","children":[{"id":"ts-lesson-callbacks","type":"slides","title":"Parameters, callbacks, rest, and void","minutes":15,"objectives":["Describe callable behavior without making promises your implementation breaks."],"sources":[{"title":"More on Functions","url":"https://www.typescriptlang.org/docs/handbook/2/functions.html"},{"title":"MDN: Functions","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Functions"}],"slides":[{"id":"ts-lesson-callbacks-concept","title":"Parameters, callbacks, rest, and void","body":"YOUR GOAL\nDescribe callable behavior without making promises your implementation breaks.\n\nA function type describes parameters and a result. Optional parameters may be omitted by the caller. For callback contracts, a parameter should only be optional if the invoking code may omit it. Callbacks can ignore extra supplied arguments without making those parameters optional."},{"id":"ts-lesson-callbacks-example","title":"Read the code","body":"```ts\nfunction visit(items: string[], callback: (item: string, index: number) => void) {\n  items.forEach(callback);\n}\nvisit([\"types\"], item => console.log(item));\nfunction sum(...values: number[]): number {\n  return values.reduce((a, b) => a + b, 0);\n}\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-callbacks-practice","title":"Try it yourself","body":"Write repeat(count, callback), where callback always receives the iteration index. Show a callback that ignores the index and one that uses it. Do not write index?: number.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-callbacks-solution","title":"Compare your solution","body":"```ts\nfunction repeat(count: number, callback: (index: number) => void): void {\n  for (let index = 0; index \u003c count; index++) callback(index);\n}\nrepeat(2, () => console.log(\"Again\"));\nrepeat(2, index => console.log(index.toFixed()));\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-callbacks-takeaway","title":"Keep this in mind","body":"A contextual () => void callback may return a value that the caller ignores. A function explicitly declared with : void cannot return an unrelated value.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-overloads","type":"slides","title":"Overloads, call signatures, and this","minutes":15,"objectives":["Choose a union or overload based on the input/output relationship."],"sources":[{"title":"More on Functions","url":"https://www.typescriptlang.org/docs/handbook/2/functions.html"},{"title":"MDN: Functions","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Functions"}],"slides":[{"id":"ts-lesson-overloads-concept","title":"Overloads, call signatures, and this","body":"YOUR GOAL\nChoose a union or overload based on the input/output relationship.\n\nPrefer a union parameter when all alternatives return the same type. Use overloads to describe meaningfully different call shapes or return types. The implementation signature must support them but is not itself a public overload. A this parameter documents the receiver without becoming a runtime argument."},{"id":"ts-lesson-overloads-example","title":"Read the code","body":"```ts\nfunction duplicate(value: string): string;\nfunction duplicate(value: number): number;\nfunction duplicate(value: string | number): string | number {\n  return typeof value === \"string\" ? value + value : value * 2;\n}\ntype Formatter = { (value: number): string; label: string };\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-overloads-practice","title":"Try it yourself","body":"Implement length(value: string | readonly unknown[]): number using a union rather than overloads. Then write a function with this: { title: string } and call it with .call().\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-overloads-solution","title":"Compare your solution","body":"```ts\nfunction length(value: string | readonly unknown[]): number {\n  return value.length;\n}\nfunction heading(this: { title: string }): string {\n  return this.title.toUpperCase();\n}\nconsole.log(heading.call({ title: \"Functions\" }));\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-overloads-takeaway","title":"Keep this in mind","body":"Overloads describe allowed calls; they do not run separate implementations. Preserve JavaScript receiver behavior when passing methods as callbacks.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-functions-quiz","type":"quiz","title":"Skill check · Design function contracts","skill":"Design function contracts","questions":[{"id":"ts-sec-functions-quiz-q1","prompt":"If an invoker always supplies an index, how should its callback parameter be typed?","options":["index?: number","index: any","index: number"],"answer":2,"explanation":"Optional means the invoker may omit it, not that a callback must use it."},{"id":"ts-sec-functions-quiz-q2","prompt":"Can callers use an overload implementation signature that is not a declared overload?","options":["Only if it has optional parameters","No","Always"],"answer":1,"explanation":"Only the overload signatures describe the public call surface."},{"id":"ts-sec-functions-quiz-q3","prompt":"Which is usually clearer for equal return behavior across input types?","options":["A union parameter","Many redundant overloads","An any parameter"],"answer":0,"explanation":"Use overloads when distinct call shapes or return relationships warrant them."}],"sources":[{"title":"More on Functions","url":"https://www.typescriptlang.org/docs/handbook/2/functions.html"},{"title":"MDN: Functions","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Functions"}]}],"sources":[{"title":"More on Functions","url":"https://www.typescriptlang.org/docs/handbook/2/functions.html"},{"title":"MDN: Functions","url":"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Functions"}],"studyGuide":{"title":"07 · Design function contracts · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["A contextual () => void callback may return a value that the caller ignores. A function explicitly declared with : void cannot return an unrelated value.","Overloads describe allowed calls; they do not run separate implementations. Preserve JavaScript receiver behavior when passing methods as callbacks."]}},{"id":"ts-sec-generics","type":"section","title":"08 · Build reusable generic APIs","children":[{"id":"ts-lesson-generic-relations","type":"slides","title":"Generics preserve relationships","minutes":15,"objectives":["Keep input and output types related without using any."],"sources":[{"title":"Generics","url":"https://www.typescriptlang.org/docs/handbook/2/generics.html"},{"title":"Generic functions","url":"https://www.typescriptlang.org/docs/handbook/2/functions.html#generic-functions"}],"slides":[{"id":"ts-lesson-generic-relations-concept","title":"Generics preserve relationships","body":"YOUR GOAL\nKeep input and output types related without using any.\n\nA type parameter captures a caller’s type and reuses it. It is useful when it connects multiple positions, such as array elements and a return value. The body must work for every allowed type. Unnecessary parameters make inference and reading harder."},{"id":"ts-lesson-generic-relations-example","title":"Read the code","body":"```ts\nfunction first\u003cT>(items: readonly T[]): T | undefined {\n  return items[0];\n}\nconst title = first([\"Types\", \"Objects\"]); // string | undefined\ntype Page\u003cT> = { items: T[]; total: number };\nconst page: Page\u003cnumber> = { items: [1, 2], total: 2 };\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-generic-relations-practice","title":"Try it yourself","body":"Write mapValues\u003cT, U>(items: readonly T[], convert: (item: T) => U): U[]. Call it to convert numbers into strings. Verify the inferred output.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-generic-relations-solution","title":"Compare your solution","body":"```ts\nfunction mapValues\u003cT, U>(items: readonly T[], convert: (item: T) => U): U[] {\n  return items.map(convert);\n}\nconst labels = mapValues([1, 2], n => `${n} min`);\nconsole.log(labels);\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-generic-relations-takeaway","title":"Keep this in mind","body":"Generics preserve information, but do not conjure runtime knowledge of T. Empty collections still need correct missing-value behavior.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-constraints","type":"slides","title":"Constraints, defaults, and key relationships","minutes":15,"objectives":["State the minimum capabilities a generic operation needs."],"sources":[{"title":"Generics","url":"https://www.typescriptlang.org/docs/handbook/2/generics.html"},{"title":"Generic functions","url":"https://www.typescriptlang.org/docs/handbook/2/functions.html#generic-functions"}],"slides":[{"id":"ts-lesson-constraints-concept","title":"Constraints, defaults, and key relationships","body":"YOUR GOAL\nState the minimum capabilities a generic operation needs.\n\nextends in a type parameter constrains allowed types. keyof can connect a key to the object it belongs to. Generic defaults provide a fallback type argument. Constraints let the implementation use promised members; they do not permit returning an arbitrary value as T."},{"id":"ts-lesson-constraints-example","title":"Read the code","body":"```ts\nfunction get\u003cT, K extends keyof T>(object: T, key: K): T[K] {\n  return object[key];\n}\nconst minutes = get({ title: \"Types\", minutes: 10 }, \"minutes\");\ntype Result\u003cT = string> = { value: T };\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-constraints-practice","title":"Try it yourself","body":"Write withLength\u003cT extends { length: number }>(value: T): T. Log its length and return the same value. Try a string, array, and number. The number should fail.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-constraints-solution","title":"Compare your solution","body":"```ts\nfunction withLength\u003cT extends { length: number }>(value: T): T {\n  console.log(value.length);\n  return value;\n}\nwithLength(\"Types\");\nwithLength([1, 2]);\n// @ts-expect-error numbers do not have length\nwithLength(3);\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-constraints-takeaway","title":"Keep this in mind","body":"A constrained T may include more properties than the constraint. Return the actual input when promising T; an object containing only the constraint can lose those properties.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-generics-quiz","type":"quiz","title":"Skill check · Build reusable generic APIs","skill":"Build reusable generic APIs","questions":[{"id":"ts-sec-generics-quiz-q1","prompt":"What does first\u003cT>(items: T[]): T | undefined preserve?","options":["Only string values","The input element type and possible absence","A guaranteed first element"],"answer":1,"explanation":"T connects the input elements and output. undefined covers an empty array."},{"id":"ts-sec-generics-quiz-q2","prompt":"What does K extends keyof T ensure?","options":["K is a permitted key of T","All values of T are strings","The key exists on every unknown runtime object"],"answer":0,"explanation":"The constraint connects the key argument to the declared object type."},{"id":"ts-sec-generics-quiz-q3","prompt":"Can a function constrained to T extends { length: number } return any fresh { length: number } as T?","options":["Yes, constraints erase additional fields","Only if strict is enabled","No; T may require additional properties"],"answer":2,"explanation":"The constraint is a minimum capability, not the entire caller-specific type."}],"sources":[{"title":"Generics","url":"https://www.typescriptlang.org/docs/handbook/2/generics.html"},{"title":"Generic functions","url":"https://www.typescriptlang.org/docs/handbook/2/functions.html#generic-functions"}]}],"sources":[{"title":"Generics","url":"https://www.typescriptlang.org/docs/handbook/2/generics.html"},{"title":"Generic functions","url":"https://www.typescriptlang.org/docs/handbook/2/functions.html#generic-functions"}],"studyGuide":{"title":"08 · Build reusable generic APIs · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["Generics preserve information, but do not conjure runtime knowledge of T. Empty collections still need correct missing-value behavior.","A constrained T may include more properties than the constraint. Return the actual input when promising T; an object containing only the constraint can lose those properties."]}},{"id":"ts-sec-operators","type":"section","title":"09 · Derive types from existing information","children":[{"id":"ts-lesson-keyof-typeof","type":"slides","title":"keyof and type-position typeof","minutes":15,"objectives":["Avoid repeating property and configuration types."],"sources":[{"title":"keyof","url":"https://www.typescriptlang.org/docs/handbook/2/keyof-types.html"},{"title":"typeof","url":"https://www.typescriptlang.org/docs/handbook/2/typeof-types.html"},{"title":"Indexed access types","url":"https://www.typescriptlang.org/docs/handbook/2/indexed-access-types.html"}],"slides":[{"id":"ts-lesson-keyof-typeof-concept","title":"keyof and type-position typeof","body":"YOUR GOAL\nAvoid repeating property and configuration types.\n\nkeyof produces permitted keys of a type. Type-position typeof gets the type of a variable or property. Runtime typeof returns a category string. These uses share spelling but do different jobs. A string index signature can make keyof include string and number."},{"id":"ts-lesson-keyof-typeof-example","title":"Read the code","body":"```ts\nconst settings = { title: \"TypeScript\", minutes: 10 };\ntype Settings = typeof settings;\ntype SettingKey = keyof Settings; // \"title\" | \"minutes\"\nfunction read(key: SettingKey) { return settings[key]; }\nconsole.log(typeof settings); // \"object\" at runtime\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-keyof-typeof-practice","title":"Try it yourself","body":"Create a const object containing three feature flags. Derive its type with typeof, then derive its key union with keyof. Write an accessor that rejects an unknown flag.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-keyof-typeof-solution","title":"Compare your solution","body":"```ts\nconst flags = { notes: true, exports: true, quizzes: false };\ntype Flag = keyof typeof flags;\nfunction enabled(flag: Flag): boolean { return flags[flag]; }\n// @ts-expect-error unknown flag\nenabled(\"payments\");\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-keyof-typeof-takeaway","title":"Keep this in mind","body":"keyof is not Object.keys(). It works on a static type and emits no list of runtime keys.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-indexed","type":"slides","title":"Indexed access and function extraction","minutes":15,"objectives":["Reuse property, element, parameter, and return types."],"sources":[{"title":"keyof","url":"https://www.typescriptlang.org/docs/handbook/2/keyof-types.html"},{"title":"typeof","url":"https://www.typescriptlang.org/docs/handbook/2/typeof-types.html"},{"title":"Indexed access types","url":"https://www.typescriptlang.org/docs/handbook/2/indexed-access-types.html"}],"slides":[{"id":"ts-lesson-indexed-concept","title":"Indexed access and function extraction","body":"YOUR GOAL\nReuse property, element, parameter, and return types.\n\nT[\"field\"] looks up a property type. T[number] gets an array element type. ReturnType and Parameters derive information from function types. Use typeof fn when starting from a function value. This reduces drift when the source definition changes."},{"id":"ts-lesson-indexed-example","title":"Read the code","body":"```ts\ntype Lesson = { id: string; minutes: number };\ntype Minutes = Lesson[\"minutes\"];\nconst lessons = [{ id: \"intro\", minutes: 10 }];\ntype Item = typeof lessons[number];\nfunction makeLesson(id: string) { return { id, minutes: 10 }; }\ntype Created = ReturnType\u003ctypeof makeLesson>;\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-indexed-practice","title":"Try it yourself","body":"Write a buildUser(name: string, active: boolean) function. Derive its argument tuple and return object type using utility types. Do not manually repeat the types.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-indexed-solution","title":"Compare your solution","body":"```ts\nfunction buildUser(name: string, active: boolean) { return { name, active }; }\ntype Arguments = Parameters\u003ctypeof buildUser>;\ntype User = ReturnType\u003ctypeof buildUser>;\nconst args: Arguments = [\"Johnny\", true];\nconst user: User = buildUser(...args);\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-indexed-takeaway","title":"Keep this in mind","body":"Types and values occupy different positions. Use typeof to bridge from a named value to its type, and avoid assuming a type expression executes a function.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-operators-quiz","type":"quiz","title":"Skill check · Derive types from existing information","skill":"Derive types from existing information","questions":[{"id":"ts-sec-operators-quiz-q1","prompt":"What is keyof { title: string; minutes: number }?","options":["\"title\" | \"minutes\"","string | number values","An array of two strings"],"answer":0,"explanation":"keyof produces a union of property keys, not a runtime array."},{"id":"ts-sec-operators-quiz-q2","prompt":"How do you get the return type of a function value named build?","options":["ReturnType\u003cbuild>","typeof build() in a type alias","ReturnType\u003ctypeof build>"],"answer":2,"explanation":"typeof build provides the function type to ReturnType."},{"id":"ts-sec-operators-quiz-q3","prompt":"What does string[][number] represent?","options":["The array length","string","number"],"answer":1,"explanation":"Indexing an array type with number extracts its element type."}],"sources":[{"title":"keyof","url":"https://www.typescriptlang.org/docs/handbook/2/keyof-types.html"},{"title":"typeof","url":"https://www.typescriptlang.org/docs/handbook/2/typeof-types.html"},{"title":"Indexed access types","url":"https://www.typescriptlang.org/docs/handbook/2/indexed-access-types.html"}]}],"sources":[{"title":"keyof","url":"https://www.typescriptlang.org/docs/handbook/2/keyof-types.html"},{"title":"typeof","url":"https://www.typescriptlang.org/docs/handbook/2/typeof-types.html"},{"title":"Indexed access types","url":"https://www.typescriptlang.org/docs/handbook/2/indexed-access-types.html"}],"studyGuide":{"title":"09 · Derive types from existing information · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["keyof is not Object.keys(). It works on a static type and emits no list of runtime keys.","Types and values occupy different positions. Use typeof to bridge from a named value to its type, and avoid assuming a type expression executes a function."]}},{"id":"ts-sec-transformations","type":"section","title":"10 · Transform types with intent","children":[{"id":"ts-lesson-mapped","type":"slides","title":"Mapped types, modifiers, and renamed keys","minutes":15,"objectives":["Derive a consistent object shape from another shape."],"sources":[{"title":"Mapped Types","url":"https://www.typescriptlang.org/docs/handbook/2/mapped-types.html"},{"title":"Conditional Types","url":"https://www.typescriptlang.org/docs/handbook/2/conditional-types.html"},{"title":"Template Literal Types","url":"https://www.typescriptlang.org/docs/handbook/2/template-literal-types.html"}],"slides":[{"id":"ts-lesson-mapped-concept","title":"Mapped types, modifiers, and renamed keys","body":"YOUR GOAL\nDerive a consistent object shape from another shape.\n\nA mapped type iterates a union of keys. T[K] connects each key to its original value type. readonly and ? can be added or removed. An as clause remaps or filters keys. Prefer a readable built-in utility unless a custom transformation adds meaning."},{"id":"ts-lesson-mapped-example","title":"Read the code","body":"```ts\ntype Flags\u003cT> = { [K in keyof T]: boolean };\ntype Mutable\u003cT> = { -readonly [K in keyof T]: T[K] };\ntype Complete\u003cT> = { [K in keyof T]-?: T[K] };\ntype Getters\u003cT> = {\n  [K in keyof T as `get${Capitalize\u003cstring & K>}`]: () => T[K]\n};\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-mapped-practice","title":"Try it yourself","body":"Given type Lesson = { title: string; minutes: number }, derive OptionalLesson with a mapped type. Then derive getter names getTitle and getMinutes without spelling them manually.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-mapped-solution","title":"Compare your solution","body":"```ts\ntype Lesson = { title: string; minutes: number };\ntype OptionalLesson = { [K in keyof Lesson]?: Lesson[K] };\ntype Getters\u003cT> = {\n  [K in keyof T as `get${Capitalize\u003cstring & K>}`]: () => T[K]\n};\nconst getters: Getters\u003cLesson> = { getTitle: () => \"Types\", getMinutes: () => 10 };\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-mapped-takeaway","title":"Keep this in mind","body":"Mapped types transform descriptions, not runtime objects. Code must still implement any generated methods or fields.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-conditional","type":"slides","title":"Conditional types, infer, and string patterns","minutes":15,"objectives":["Recognize advanced type transformations and their limits."],"sources":[{"title":"Mapped Types","url":"https://www.typescriptlang.org/docs/handbook/2/mapped-types.html"},{"title":"Conditional Types","url":"https://www.typescriptlang.org/docs/handbook/2/conditional-types.html"},{"title":"Template Literal Types","url":"https://www.typescriptlang.org/docs/handbook/2/template-literal-types.html"}],"slides":[{"id":"ts-lesson-conditional-concept","title":"Conditional types, infer, and string patterns","body":"YOUR GOAL\nRecognize advanced type transformations and their limits.\n\nT extends U ? X : Y selects a type based on assignability. infer captures a matched piece. A conditional with a naked type parameter distributes over unions; wrapping it in a tuple can prevent distribution. Template literal types compose string patterns and can create large unions."},{"id":"ts-lesson-conditional-example","title":"Read the code","body":"```ts\ntype ElementOf\u003cT> = T extends readonly (infer U)[] ? U : T;\ntype ToArray\u003cT> = T extends unknown ? T[] : never;\ntype Together\u003cT> = [T] extends [unknown] ? T[] : never;\ntype EventName = `${\"lesson\" | \"quiz\"}Completed`;\ntype Separate = ToArray\u003cstring | number>; // string[] | number[]\ntype Combined = Together\u003cstring | number>; // (string | number)[]\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-conditional-practice","title":"Try it yourself","body":"Create Unwrap\u003cT> that extracts a Promise payload and otherwise returns T. Derive a completion event name from title | minutes using a template literal. Explain the distributive behavior of Unwrap on a union.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-conditional-solution","title":"Compare your solution","body":"```ts\ntype Unwrap\u003cT> = T extends Promise\u003cinfer U> ? U : T;\ntype A = Unwrap\u003cPromise\u003cstring>>;\ntype B = Unwrap\u003cPromise\u003cstring> | number>; // string | number\ntype Field = \"title\" | \"minutes\";\ntype Changed = `${Field}Changed`;\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-conditional-takeaway","title":"Keep this in mind","body":"Advanced type computation can become harder to maintain than an explicit type. Keep recursive and string-union transformations bounded. Unwrap here is shallow; Awaited handles recursive promise-like unwrapping.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-transformations-quiz","type":"quiz","title":"Skill check · Transform types with intent","skill":"Transform types with intent","questions":[{"id":"ts-sec-transformations-quiz-q1","prompt":"Does a mapped type create runtime object properties?","options":["Yes, on import","Only with noEmit disabled","No, it creates a type description"],"answer":2,"explanation":"Runtime objects still need an implementation."},{"id":"ts-sec-transformations-quiz-q2","prompt":"What does infer do inside a conditional type?","options":["Disables union distribution","Captures a type from a matching shape","Reads a runtime JSON value"],"answer":1,"explanation":"infer introduces a type variable for a matched part of the tested type."},{"id":"ts-sec-transformations-quiz-q3","prompt":"What does ToArray\u003cT> = T extends unknown ? T[] : never produce for string | number?","options":["string[] | number[]","Only string[]","Always never"],"answer":0,"explanation":"The naked type parameter causes the conditional to distribute over each union member."}],"sources":[{"title":"Mapped Types","url":"https://www.typescriptlang.org/docs/handbook/2/mapped-types.html"},{"title":"Conditional Types","url":"https://www.typescriptlang.org/docs/handbook/2/conditional-types.html"},{"title":"Template Literal Types","url":"https://www.typescriptlang.org/docs/handbook/2/template-literal-types.html"}]}],"sources":[{"title":"Mapped Types","url":"https://www.typescriptlang.org/docs/handbook/2/mapped-types.html"},{"title":"Conditional Types","url":"https://www.typescriptlang.org/docs/handbook/2/conditional-types.html"},{"title":"Template Literal Types","url":"https://www.typescriptlang.org/docs/handbook/2/template-literal-types.html"}],"studyGuide":{"title":"10 · Transform types with intent · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["Mapped types transform descriptions, not runtime objects. Code must still implement any generated methods or fields.","Advanced type computation can become harder to maintain than an explicit type. Keep recursive and string-union transformations bounded. Unwrap here is shallow; Awaited handles recursive promise-like unwrapping."]}},{"id":"ts-sec-utilities","type":"section","title":"11 · Use the standard utility types","children":[{"id":"ts-lesson-object-utilities","type":"slides","title":"Transform object contracts","minutes":15,"objectives":["Use built-in helpers for projections and update shapes."],"sources":[{"title":"Utility Types","url":"https://www.typescriptlang.org/docs/handbook/utility-types.html"}],"slides":[{"id":"ts-lesson-object-utilities-concept","title":"Transform object contracts","body":"YOUR GOAL\nUse built-in helpers for projections and update shapes.\n\nPartial makes properties optional. Required makes them required. Readonly restricts top-level writes. Pick selects keys; Omit removes keys. Record assigns a value type to keys. These are shallow static transformations: an optional update object still needs business-rule checks."},{"id":"ts-lesson-object-utilities-example","title":"Read the code","body":"```ts\ntype Lesson = { id: string; title: string; minutes: number };\ntype Update = Partial\u003cPick\u003cLesson, \"title\" | \"minutes\">>;\ntype Preview = Omit\u003cLesson, \"minutes\">;\ntype Snapshot = Readonly\u003cLesson>;\nconst patch: Update = { title: \"New title\" };\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-object-utilities-practice","title":"Try it yourself","body":"Create User with id, email and passwordHash. Derive PublicUser without passwordHash. Create a settings patch that permits only email, never id. Explain why this does not sanitize an arbitrary runtime object.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-object-utilities-solution","title":"Compare your solution","body":"```ts\ntype User = { id: string; email: string; passwordHash: string };\ntype PublicUser = Omit\u003cUser, \"passwordHash\">;\ntype UserPatch = Partial\u003cPick\u003cUser, \"email\">>;\nfunction publicUser(user: User): PublicUser {\n  return { id: user.id, email: user.email };\n}\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-object-utilities-takeaway","title":"Keep this in mind","body":"Omit changes the type, not the runtime contents. Explicitly construct public outputs when fields must actually be removed.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-lesson-union-utilities","type":"slides","title":"Extract unions, signatures, and promise results","minutes":15,"objectives":["Read utility types used in library APIs."],"sources":[{"title":"Utility Types","url":"https://www.typescriptlang.org/docs/handbook/utility-types.html"}],"slides":[{"id":"ts-lesson-union-utilities-concept","title":"Extract unions, signatures, and promise results","body":"YOUR GOAL\nRead utility types used in library APIs.\n\nExclude removes union members; Extract keeps matching members. NonNullable removes null and undefined. Awaited models recursive promise-like unwrapping. Parameters, ReturnType, ConstructorParameters and InstanceType extract callable or constructable information. ThisParameterType, OmitThisParameter and ThisType describe receiver relationships. NoInfer limits inference from a chosen position."},{"id":"ts-lesson-union-utilities-example","title":"Read the code","body":"```ts\ntype State = \"draft\" | \"published\" | \"archived\";\ntype Visible = Exclude\u003cState, \"archived\">;\ntype Published = Extract\u003cState, \"published\" | \"missing\">;\ntype Text = NonNullable\u003cstring | null | undefined>;\ntype Payload = Awaited\u003cPromise\u003cPromise\u003cnumber>>>;\nfunction choose\u003cT>(items: T[], fallback: NoInfer\u003cT>): T {\n  return items[0] ?? fallback;\n}\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-union-utilities-practice","title":"Try it yourself","body":"Use Exclude to remove error from idle | loading | ready | error. Derive the instance and constructor-argument types of a class with a string constructor. Explain when NoInfer could prevent an unintended wider union.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-union-utilities-solution","title":"Compare your solution","body":"```ts\ntype State = \"idle\" | \"loading\" | \"ready\" | \"error\";\ntype NormalState = Exclude\u003cState, \"error\">;\nclass Lesson { constructor(public title: string) {
