ing."}]},{"id":"ts-lesson-capstone-queries","type":"slides","title":"Capstone: typed queries and verification","minutes":15,"objectives":["Combine generics, immutability, and meaningful tests."],"sources":[{"title":"Boundary validation","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html"},{"title":"Generic API relationships","url":"https://www.typescriptlang.org/docs/handbook/2/generics.html"},{"title":"Domain shapes","url":"https://www.typescriptlang.org/docs/handbook/2/objects.html"},{"title":"Module boundaries","url":"https://www.typescriptlang.org/docs/handbook/2/modules.html"}],"slides":[{"id":"ts-lesson-capstone-queries-concept","title":"Capstone: typed queries and verification","body":"YOUR GOAL\nCombine generics, immutability, and meaningful tests.\n\nAdd a generic getProperty, a totalMinutes query, an immutable title update and a parser that rejects duplicate IDs. Verify both static contracts and runtime outcomes. Do not mark practical mastery just because slides are complete. The quiz checks concepts; the project rubric checks application."},{"id":"ts-lesson-capstone-queries-example","title":"Read the code","body":"```ts\ntype Lesson = { id: string; title: string; minutes: number };\nfunction getProperty\u003cT, K extends keyof T>(value: T, key: K): T[K] {\n  return value[key];\n}\nfunction totalMinutes(lessons: readonly Lesson[]): number {\n  return lessons.reduce((sum, lesson) => sum + lesson.minutes, 0);\n}\n```\n\nPredict what the compiler checks and what happens when the code runs. These are separate questions."},{"id":"ts-lesson-capstone-queries-practice","title":"Try it yourself","body":"Build the project in examples/catalog.ts or write your own. Meet the rubric in examples/README.md: validation, duplicate rejection, typed lookup, immutable updates, exhaustive result handling, type tests and runtime tests.\n\nUse your editor or the TypeScript Playground. Try before opening the next slide. Practice is self-assessed; this LMS does not execute or grade code."},{"id":"ts-lesson-capstone-queries-solution","title":"Compare your solution","body":"```ts\ntype Lesson = { id: string; title: string; minutes: number };\nfunction rename(lessons: readonly Lesson[], id: string, title: string): Lesson[] {\n  if (!title.trim()) throw new Error(\"Title is required\");\n  return lessons.map(lesson => lesson.id === id ? { ...lesson, title } : lesson);\n}\nconst original = [{ id: \"a\", title: \"Types\", minutes: 10 }];\nconst updated = rename(original, \"a\", \"Everyday types\");\nconsole.log(original[0]?.title, updated[0]?.title);\n```\n\nCompare behavior and types, rather than matching every character. Explain your choices aloud or in lesson notes."},{"id":"ts-lesson-capstone-queries-takeaway","title":"Keep this in mind","body":"Run npx tsc --noEmit and actual runtime tests. A typed return contract and an exhaustive switch protect maintenance; edge-case tests verify the behavior your users experience.\n\nBefore completing: make your example work, deliberately introduce a mistake, and explain the compiler response. Use the lesson sources below for deeper reading."}]},{"id":"ts-sec-capstone-quiz","type":"quiz","title":"Skill check · Build and verify a typed learning catalog","skill":"Build and verify a typed learning catalog","questions":[{"id":"ts-sec-capstone-quiz-q1","prompt":"Where should duplicate lesson IDs be rejected?","options":["By an as Lesson[] assertion","When validating the catalog collection","Only by the string type"],"answer":1,"explanation":"Uniqueness is a collection-level invariant that needs runtime logic."},{"id":"ts-sec-capstone-quiz-q2","prompt":"Which test targets real boundary behavior?","options":["Rejecting null, blank IDs, invalid minutes and duplicate IDs","Only checking that a function exists","Only using as Lesson[] on sample JSON"],"answer":0,"explanation":"Malformed inputs exercise the validator and business rules rather than mirroring the implementation."},{"id":"ts-sec-capstone-quiz-q3","prompt":"Does reading every slide establish practical mastery?","options":["Yes, automatically","Only after refreshing","No; apply the skills and meet the project rubric"],"answer":2,"explanation":"Completion tracks learning activity. Demonstrated skill requires solving and verifying practical tasks."}],"sources":[{"title":"Boundary validation","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html"},{"title":"Generic API relationships","url":"https://www.typescriptlang.org/docs/handbook/2/generics.html"},{"title":"Domain shapes","url":"https://www.typescriptlang.org/docs/handbook/2/objects.html"},{"title":"Module boundaries","url":"https://www.typescriptlang.org/docs/handbook/2/modules.html"}]}],"sources":[{"title":"Boundary validation","url":"https://www.typescriptlang.org/docs/handbook/2/narrowing.html"},{"title":"Generic API relationships","url":"https://www.typescriptlang.org/docs/handbook/2/generics.html"},{"title":"Domain shapes","url":"https://www.typescriptlang.org/docs/handbook/2/objects.html"},{"title":"Module boundaries","url":"https://www.typescriptlang.org/docs/handbook/2/modules.html"}],"studyGuide":{"title":"20 · Build and verify a typed learning catalog · Completion study guide","summary":"Review the 2 skills below, then use the exercises to check what you can do without the examples.","takeaways":["Define acceptance criteria before implementation. Duplicate IDs are a catalog-level rule, not an individual Lesson rule; check them when parsing the collection.","Run npx tsc --noEmit and actual runtime tests. A typed return contract and an exhaustive switch protect maintenance; edge-case tests verify the behavior your users experience."]}}],"finalQuiz":{"id":"ts-final-skills","type":"quiz","title":"Final assessment · Apply your TypeScript judgment","skill":"Integrated TypeScript judgment","questions":[{"id":"ts-final-scenario-1","prompt":"An API sends minutes as text. What makes it a validated number?","options":["Convert and check the runtime value","Use as number","Add a number return annotation"],"answer":0,"explanation":"Annotations are erased; conversion and validation are runtime work."},{"id":"ts-final-scenario-2","prompt":"A duration of zero is valid, but missing durations default to 10. Which expression fits?","options":["duration || 10","Boolean(duration)","duration ?? 10"],"answer":2,"explanation":"Nullish coalescing preserves zero while handling absent values."},{"id":"ts-final-scenario-3","prompt":"You want a settings object checked without replacing its useful inferred shape. What fits?","options":["A non-null assertion","satisfies","JSON.parse alone"],"answer":1,"explanation":"satisfies checks a static contract while retaining the resulting expression type."},{"id":"ts-final-scenario-4","prompt":"A list lookup may not find an item. What should the return contract express?","options":["Lesson | undefined","Always Lesson","never"],"answer":0,"explanation":"Model possible absence instead of claiming that a lookup always succeeds."},{"id":"ts-final-scenario-5","prompt":"An object has an id field but its value is a number. Is an in check alone enough to prove id: string?","options":["Yes, in validates values","Yes, with strict","No, also check the property's value type"],"answer":2,"explanation":"Property presence and property value type are separate checks."},{"id":"ts-final-scenario-6","prompt":"A success response requires data and failure requires a message. Which model prevents unrelated optional-field combinations?","options":["any","A discriminated union","All fields optional"],"answer":1,"explanation":"The discriminator ties each state to its required payload."},{"id":"ts-final-scenario-7","prompt":"Your iterator always passes an index but callbacks may ignore it. Which contract fits?","options":["(item: string, index: number) => void","(item: string, index?: number) => void","Function"],"answer":0,"explanation":"Ignoring a supplied parameter does not mean the invoker may omit it."},{"id":"ts-final-scenario-8","prompt":"You need a getter preserving the selected property's result type. What fits?","options":["get(value: any, key: string): any","get(value: object, key: number): string","get\u003cT, K extends keyof T>(value: T, key: K): T[K]"],"answer":2,"explanation":"Generic constraints connect the object, its permitted keys and its result type."},{"id":"ts-final-scenario-9","prompt":"A function build changes its result fields. How can a dependent type avoid manual duplication?","options":["typeof build() as a type expression","ReturnType\u003ctypeof build>","Copy the old shape"],"answer":1,"explanation":"The utility derives the result from the function's type without executing it."},{"id":"ts-final-scenario-10","prompt":"You need a boolean flag for every existing property. Which feature derives that shape?","options":["A mapped type over keyof T","A runtime typeof string","An interface with no fields"],"answer":0,"explanation":"Mapped types can systematically derive properties from existing keys."},{"id":"ts-final-scenario-11","prompt":"A public output must actually exclude a secret field. What is required?","options":["Annotate the original object Omit\u003cUser, 'secret'>","Use a type assertion","Construct an output containing only public fields"],"answer":2,"explanation":"Erased types do not sanitize runtime objects."},{"id":"ts-final-scenario-12","prompt":"A method uses this but is passed unbound as a callback. Can its types alone preserve its receiver?","options":["Yes, with readonly","No; bind it, wrap it, or use suitable arrow-function behavior","Yes, with implements"],"answer":1,"explanation":"Receiver binding is JavaScript runtime behavior and needs an appropriate implementation."},{"id":"ts-final-scenario-13","prompt":"An alias resolves in the editor but fails in Node output. What should you inspect?","options":["Runtime resolution and alias configuration, not only paths","Only interface names","Only font settings"],"answer":0,"explanation":"TypeScript paths does not rewrite emitted imports or configure the host loader."},{"id":"ts-final-scenario-14","prompt":"A bundler succeeds while tsc reports an error. What does that suggest?","options":["The error is necessarily false","The browser will validate the types","The bundler may be transpiling without type checking"],"answer":2,"explanation":"Separate emission and type checking so successful bundling does not hide diagnostics."},{"id":"ts-final-scenario-15","prompt":"A .d.ts declares an export absent from the actual package. What can happen?","options":["The declaration is automatically ignored","Code type-checks but fails at runtime","TypeScript creates the missing export"],"answer":1,"explanation":"Declarations can be inaccurate; consumer compile and runtime tests are both useful."},{"id":"ts-final-scenario-16","prompt":"You want useful checking in a JavaScript file before converting it. Which option fits?","options":["@ts-check with supported JSDoc annotations","A blanket @ts-nocheck","Casting every value to any"],"answer":0,"explanation":"Opt-in JS checking and documented boundary types provide an incremental migration path."},{"id":"ts-final-scenario-17","prompt":"A fetch resolves with HTTP 500 and malformed data. What should the loader check?","options":["Only its Promise return annotation","Only that fetch resolved","HTTP status and payload shape"],"answer":2,"explanation":"HTTP success and valid payload structure are different conditions."},{"id":"ts-final-scenario-18","prompt":"A library example uses namespace declarations. Does that automatically mean it is an ESM runtime module?","options":["Yes, with JSX enabled","No, check the library's actual loading and declaration structure","Yes, all namespaces are imports"],"answer":1,"explanation":"Namespaces, ambient declarations and ES modules describe different integration patterns."},{"id":"ts-final-scenario-19","prompt":"An async resource must be acquired and then disposed asynchronously. Which expression shows both waits?","options":["await using resource = await acquireAsync()","using resource = acquireAsync() always does both","await using resource = acquireAsync() automatically awaits acquisition"],"answer":0,"explanation":"The declaration awaits disposal; the initializer's separate await awaits acquisition."},{"id":"ts-final-scenario-20","prompt":"Your capstone passes type checks. What else establishes correct malformed-input behavior?","options":["More type assertions","Only reading the solution","Runtime tests for invalid fields, null and duplicate IDs"],"answer":2,"explanation":"Static contracts cannot replace execution tests of validation and business rules."}]},"settings":{"passScore":80,"allowRetakes":true,"sequential":true,"requireLessons":true,"brand":"#3178c6","background":"#0c0e12","surface":"#14171d","text":"#edf0f7","muted":"#a6afc0","border":"#343b49","fontScale":1,"spacing":24,"contentWidth":1000,"radius":8,"font":"humanist","headingFont":"system","lineHeight":1.7,"unlockAll":true,"showLessonDetails":false}}</script></body></html>
